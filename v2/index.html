<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>장원급제반</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b6af0">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="장원급제반">
<style>
@font-face{
  font-family:'Pretendard';
  src:url('fonts/PretendardVariable.woff2') format('woff2');
  font-weight:45 920; font-style:normal; font-display:swap;
}

:root{
  --ink:#1a1a2e; --ink-soft:#4a4a6a; --ink-mute:#6b6b83;
  --line:#e8e8f0; --line-soft:#f2f2f8; --bg:#f7f7fc; --surface:#ffffff;
  --accent:#5b6af0; --accent-soft:#eef0ff; --accent-hover:#4555e8;
  --green:#22c55e; --green-soft:#dcfce7;
  --orange:#f97316; --orange-soft:#ffedd5;
  --rose:#f43f5e; --rose-soft:#ffe4e6;
  --sky:#0ea5e9; --sky-soft:#e0f2fe;
  --gold:#b8860b; --gold-soft:#fdf3d8;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:14px; --radius-sm:8px;
  --shadow:0 2px 12px rgba(26,26,46,0.07); --shadow-md:0 4px 24px rgba(26,26,46,0.1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.2px;}
body{display:flex;justify-content:center;min-height:100vh;}
#app,#login{width:100%;max-width:430px;background:var(--bg);}
@media(min-width:600px){#app,#login{max-width:600px;}}
.hidden{display:none !important;}
input,select,textarea{font-family:inherit;font-size:16px;}
.ico{display:block;flex-shrink:0;}

/* ── 로그인 ───────────────────────────────── */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:32px 24px calc(32px + var(--safe-bottom));background:var(--surface);}
.login-brand{text-align:center;margin-bottom:36px;}
.login-mark{width:72px;height:72px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;}
.login-mark img{display:block;width:72px;height:72px;}
.login-title{font-size:1.55rem;font-weight:800;letter-spacing:-0.5px;}
.login-sub{font-size:0.86rem;color:var(--ink-mute);margin-top:6px;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
input[type=text],input[type=tel],select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);color:var(--ink);background:var(--surface);outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,106,240,.1);}
input::placeholder{color:#b4b4c8;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 20px;
  background:var(--accent);color:#fff;border:none;font-family:inherit;font-size:0.95rem;font-weight:600;
  cursor:pointer;border-radius:var(--radius-sm);transition:background .2s,transform .1s,box-shadow .2s;margin-top:8px;}
.btn:hover{background:var(--accent-hover);box-shadow:0 4px 16px rgba(91,106,240,.3);}
.btn:active{transform:scale(.98);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);}
.btn-outline:hover{background:var(--line-soft);box-shadow:none;border-color:var(--ink-mute);}
.btn-sm{width:auto;padding:8px 14px;font-size:0.8rem;margin:0;}
.login-divider{display:flex;align-items:center;gap:12px;margin:24px 0 16px;color:var(--ink-mute);font-size:0.76rem;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line);}

/* ── 헤더 + 탭바 ──────────────────────────── */
.header{background:var(--surface);padding:0 18px;padding-top:calc(14px + var(--safe-top));
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;}
.h-name{font-size:1.22rem;font-weight:800;letter-spacing:-0.4px;line-height:1.2;}
.h-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.h-role{font-size:0.76rem;color:var(--ink-mute);}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:0.7rem;font-weight:700;
  padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);}
.chip-gold{background:var(--gold-soft);color:var(--gold);}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--ink-mute);
  border-radius:8px;transition:background .15s,color .15s;position:relative;}
.icon-btn:hover{background:var(--line-soft);color:var(--ink);}
.dot-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;
  background:var(--rose);color:#fff;font-size:0.6rem;font-weight:700;line-height:16px;text-align:center;padding:0 4px;}

.tab-bar{display:flex;}
.tab-btn{flex:1;min-width:0;padding:11px 2px 9px;background:transparent;border:none;
  border-bottom:2.5px solid transparent;font-family:inherit;font-size:0.7rem;font-weight:500;
  color:var(--ink-mute);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  transition:color .15s,border-color .15s;}
.tab-btn .ico{transition:transform .15s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab-btn.active .ico{transform:scale(1.08) translateY(-1px);}

/* ── 본문 ─────────────────────────────────── */
main{padding:6px 18px calc(32px + var(--safe-bottom));}
.sec-label{font-size:0.74rem;font-weight:700;color:var(--ink-mute);letter-spacing:.3px;
  margin:26px 2px 10px;}

/* 히어로 — 박스 없이 배경 위에 바로 */
.hero{padding:14px 2px 20px;}
.hero-lbl{font-size:0.76rem;color:var(--ink-mute);font-weight:600;}
.hero-num{font-size:2.7rem;font-weight:800;letter-spacing:-2px;line-height:1.05;margin-top:5px;}
.hero-num small{font-size:1.05rem;font-weight:700;letter-spacing:0;margin-left:3px;}
.hero-sub{font-size:0.78rem;color:var(--ink-mute);margin-top:8px;}
.hero-inline{display:flex;gap:22px;margin-top:16px;}
.hero-inline div{font-size:0.78rem;color:var(--ink-mute);font-weight:600;}
.hero-inline b{display:block;font-size:1.25rem;color:var(--ink);letter-spacing:-.5px;margin-top:2px;}

/* 카드 = 행 묶음 (테두리 없이 아주 옅은 그림자만) */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:12px;padding:0 18px;}
.card.pad{padding:18px;}
.row{display:flex;align-items:center;gap:13px;padding:16px 0;border-top:1px solid var(--line-soft);
  cursor:pointer;}
.row:first-child{border-top:none;}
.blk{padding:17px 0;border-top:1px solid var(--line-soft);}
.blk:first-child{border-top:none;}
.blk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.row-main{flex:1;min-width:0;}
.row-t{font-size:0.92rem;font-weight:700;}
.row-s{font-size:0.75rem;color:var(--ink-mute);margin-top:3px;}
.row-v{font-size:1.05rem;font-weight:800;letter-spacing:-.5px;white-space:nowrap;}
.row-chev{color:#c8c8d8;flex-shrink:0;}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.88rem;flex-shrink:0;}

/* 체크인 — 화면의 유일한 강조 버튼 */
.checkin{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:18px;
  cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(91,106,240,.28);
  transition:transform .1s;margin-bottom:4px;}
.checkin:active{transform:scale(.99);}
.checkin.done{background:var(--green-soft);color:#16a34a;box-shadow:none;cursor:default;}
.checkin-t{font-size:1.02rem;font-weight:700;}
.checkin-s{font-size:0.76rem;opacity:.85;margin-top:4px;}

/* 진행바 */
.bar{background:var(--line-soft);border-radius:6px;height:7px;overflow:hidden;margin-top:10px;}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s;}
.bar>i.g{background:var(--green);}

/* 주간 도트 */
.week-row{display:flex;gap:7px;margin-top:13px;}
.day{flex:1;text-align:center;}
.day-lbl{font-size:0.68rem;color:var(--ink-mute);margin-bottom:6px;}
.day-dot{width:100%;aspect-ratio:1;max-width:36px;margin:0 auto;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;
  background:var(--line-soft);color:#c0c0d0;}
.day-dot.ok{background:var(--green-soft);color:#16a34a;}
.day-dot.late{background:var(--orange-soft);color:var(--orange);}
.day-dot.no{background:var(--rose-soft);color:var(--rose);}
.day-dot.today{outline:2px solid var(--accent);outline-offset:2px;}

/* 바로가기 — 박스 없이 아이콘 한 줄 */
.quick{display:flex;gap:2px;}
.quick button{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;transition:transform .1s;}
.quick button:active{transform:scale(.94);}
.qi{width:50px;height:50px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);}
.qi.g{background:var(--green-soft);color:#16a34a;} .qi.o{background:var(--orange-soft);color:var(--orange);}
.qi.s{background:var(--sky-soft);color:var(--sky);} .qi.y{background:var(--gold-soft);color:var(--gold);}
.qi.r{background:var(--rose-soft);color:var(--rose);}
.ql{font-size:0.72rem;font-weight:600;color:var(--ink-soft);}

/* 알림 한 줄 (배너 박스 대신) */
.notice{display:flex;align-items:center;gap:7px;padding:11px 2px;font-size:0.8rem;
  font-weight:600;color:var(--gold);cursor:pointer;}
.notice.accent{color:var(--accent);}

.empty{text-align:center;color:var(--ink-mute);padding:44px 20px;font-size:0.86rem;line-height:1.9;}
.empty-ico{display:flex;justify-content:center;margin-bottom:10px;opacity:.5;color:var(--accent);}

/* 뷰 전환 (프로토타입 전용) */
#proto{position:fixed;bottom:calc(14px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);border-radius:22px;padding:5px;display:flex;gap:3px;z-index:500;
  box-shadow:0 8px 30px rgba(0,0,0,.25);}
#proto button{background:none;border:none;color:rgba(255,255,255,.55);font-family:inherit;
  font-size:0.74rem;font-weight:600;padding:7px 14px;border-radius:18px;cursor:pointer;white-space:nowrap;}
#proto button.on{background:rgba(255,255,255,.16);color:#fff;}
</style>
</head>

<!-- ══════════ 로그인 ══════════ -->
<div id="login">
  <div class="login-brand">
    <div class="login-mark"><img src="icons/icon-512.png" alt="" width="72" height="72"></div>
    <div class="login-title">장원급제반</div>

  </div>

  <button class="btn" onclick="enterApp('student')">입실하기</button>
  <div class="login-divider">또는</div>
  <button class="btn btn-outline" onclick="enterApp('teacher')">
    <span class="ico-slot" data-ico="person" data-sz="17"></span>교사로 입실
  </button>
  <button class="btn btn-outline" onclick="enterApp('teacher')">
    <span class="ico-slot" data-ico="cap" data-sz="17"></span>방과후 강사 로그인
  </button>

<!-- ══════════ 앱 ══════════ -->
<div id="app" class="hidden">
  <div class="header">

<!-- ═══ Firebase (조회·체크인 전부 여기로. GAS 안 거침) ═══ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey:"AIzaSyDRViuzADHxHnvv78jfnvPbAJ5hH3wzpCw",
  authDomain:"topclass-be740.firebaseapp.com",
  projectId:"topclass-be740",
  storageBucket:"topclass-be740.firebasestorage.app",
  messagingSenderId:"662651378616",
  appId:"1:662651378616:web:6eceb1505265c0700bcd4d"
}));

/* 방과후 체크인은 그날 18:30~24:00(한국시간)에만 가능하므로,
   특정 날짜의 기록은 그 구간의 타임스탬프 범위로 조회하면 된다.
   date 문자열 대신 서버 시각(at)을 기준으로 삼아야 위조가 불가능하다. */
function kstRange(dateStr){
  const from = new Date(dateStr + 'T18:30:00+09:00');
  const d    = new Date(dateStr + 'T00:00:00+09:00');
  d.setDate(d.getDate() + 1);
  const to   = new Date(d.toISOString().slice(0,10) + 'T00:00:00+09:00');
  return { from, to };
}

window.FS = {
  async schedule(){
    const s = await getDoc(doc(db,'schedule','afterschool'));
    if (!s.exists()) return { weekly:[], exceptions:[] };
    // GAS가 weekly/exceptions를 JSON 문자열로 저장한다 — 배열이면 그대로, 문자열이면 파싱
    const parse = v => {
      if (Array.isArray(v)) return v;
      try { const p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch(e){ return []; }
    };
    const d = s.data();
    return { weekly: parse(d.weekly), exceptions: parse(d.exceptions) };
  },
  async members(){
    const snap = await getDocs(collection(db,'members'));
    const out = [];
    snap.forEach(d => { const v = d.data();
      const n = String(v.name||'').trim();
      if (n && n !== '교사' && n !== '테스트' && v.role !== 'teacher')
        out.push({ name:n, track:String(v.track||'공무원').trim(), coins:Number(v.coins)||0 });
    });
    return out.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  },
  async checkIns(dateStr){
    const { from, to } = kstRange(dateStr);
    const snap = await getDocs(query(collection(db,'asCheckIn'),
      where('at','>=',from), where('at','<',to)));
    const out = [];
    snap.forEach(d => out.push(d.data()));
    return out;
  },
  async checkIn(dateStr, subject, name, track){
    const id = (dateStr+'_'+subject+'_'+name).replace(/[^\wㄱ-ㅎ가-힣-]/g,'_');
    await setDoc(doc(db,'asCheckIn',id),
      { at: serverTimestamp(), subject, name, track });
  }
};
window.dispatchEvent(new Event('fs-ready'));
</script>

function fillIcoSlots(root){

/* ═══ 방과후 출석체크 ═══════════════════════════════════
   수업 시작 18:30 · 마감 당일 24:00 (전부 한국시간)
   결석은 저장하지 않는다 — 체크인 기록이 없으면 결석으로 계산한다.
   자정이 지나면 자동으로 결석이 확정되므로 마감 트리거가 필요 없다. */
var AS_START_MIN = 18*60 + 30;   // 18:30
var asDate = null;               // 교사가 보고 있는 날짜

function pad2(n){return String(n).padStart(2,'0');}
/** 브라우저 시계와 무관하게 한국시간으로 환산 */
function kstNow(){
  var d=new Date();
  return new Date(d.getTime() + d.getTimezoneOffset()*60000 + 9*3600000);
}
function kstToday(){var k=kstNow();return k.getFullYear()+'-'+pad2(k.getMonth()+1)+'-'+pad2(k.getDate());}
function kstMinutes(){var k=kstNow();return k.getHours()*60+k.getMinutes();}

/** 수업의 대상 반 — GAS _classTrack과 동일 규칙 */
function classTrack(c){
  var t=String(c.track||'').trim();
  if(t==='공무원'||t==='공기업') return t;
  var s=String(c.subject||'');
  if(s.indexOf('공무원')>=0) return '공무원';
  if(s.indexOf('공기업')>=0) return '공기업';
  return '공통';
}

/** 그 날짜에 실제로 열리는 수업 목록 (반복수업 + 특강 − 휴강) */
function classesOn(sched, dateStr){
  var WD=['일','월','화','수','목','금','토'];
  var wd=WD[new Date(dateStr+'T00:00:00+09:00').getDay()];
  var ex=sched.exceptions||[];
  var cancels=ex.filter(function(e){return e.date===dateStr&&e.type==='휴강';});
  var items=(sched.weekly||[])
    .filter(function(c){return c.day===wd;})
    .filter(function(c){return (!c.startDate||dateStr>=c.startDate)&&(!c.endDate||dateStr<=c.endDate);})
    .filter(function(c){return !cancels.some(function(x){return x.subject===c.subject;});});
  ex.filter(function(e){return e.date===dateStr&&e.type==='특강';}).forEach(function(e){items.push(e);});
  return items;
}

async function renderAfterSchool(v){
  v.innerHTML='<div class="empty"><span>불러오는 중...</span></div>';
  if(!window.FS){v.innerHTML='<div class="empty"><span>연결 준비 중입니다<br>잠시 후 다시 시도해주세요</span></div>';return;}
  try{
    if(ROLE==='student') await renderAsStudent(v);
    else                 await renderAsTeacher(v);
  }catch(e){
    v.innerHTML='<div class="empty"><div class="empty-ico">'+ic('warn',40)+'</div>'+
      '<span>불러오지 못했습니다<br><span style="font-size:.78rem">'+String(e.message||e)+'</span></span></div>';
  }
  fillIcoSlots(v);
}

/* ── 학생: 오늘 수업 + 체크인 ── */
async function renderAsStudent(v){
  var today=kstToday();
  var sched=await FS.schedule();
  var all=classesOn(sched,today);
  var mine=all.filter(function(c){var t=classTrack(c);return t==='공통'||t===ME.track;});

  if(!mine.length){
    v.innerHTML='<div class="empty"><div class="empty-ico">'+ic('calendar',44)+'</div>'+
      '<span>오늘은 방과후 수업이 없어요</span></div>';
    return;
  }

  var recs=await FS.checkIns(today);
  var doneSet={};
  recs.forEach(function(r){ if(r.name===ME.name) doneSet[r.subject]=1; });

  var min=kstMinutes(), open=min>=AS_START_MIN;
  var html='<div class="sec-label">'+today.slice(5).replace('-','월 ')+'일 방과후</div>';

  mine.forEach(function(c){
    var done=!!doneSet[c.subject];
    html+='<div class="card pad" style="margin-bottom:10px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">'+
        '<div><div class="row-t">'+c.subject+'</div>'+
        '<div class="row-s">'+(c.teacher?c.teacher+' 선생님 · ':'')+'18:30 시작</div></div>'+
        (done?'<span class="chip" style="background:var(--green-soft);color:#16a34a">✓ 출석완료</span>':'')+
      '</div>'+
      (done?'':
        open
          ? '<button class="btn" style="margin-top:14px" onclick="doAsCheckIn(\''+c.subject.replace(/'/g,"\\'")+'\')">출석 체크하기</button>'
          : '<div style="margin-top:12px;padding:12px;background:var(--line-soft);border-radius:8px;'+
            'font-size:.82rem;color:var(--ink-mute);text-align:center">18:30부터 체크할 수 있어요</div>')+
    '</div>';
  });

  html+='<div class="notice" style="color:var(--ink-mute);cursor:default">'+ic('clock',15)+
        '<span>오늘 24시까지 체크하지 않으면 결석 처리됩니다</span></div>';
  v.innerHTML=html;
}

async function doAsCheckIn(subject){
  if(kstMinutes()<AS_START_MIN){alert('18:30부터 체크할 수 있어요.');return;}
  try{
    await FS.checkIn(kstToday(),subject,ME.name,ME.track);
    renderView();
  }catch(e){
    alert('체크인하지 못했습니다.\n' + (e.message||e));
  }
}

/* ── 교사: 날짜별 수업·학생 출석 현황 ── */
async function renderAsTeacher(v){
  if(!asDate) asDate=kstToday();
  var sched=await FS.schedule();
  var classes=classesOn(sched,asDate);

  var html='<div class="card pad" style="margin-bottom:14px">'+
    '<label style="display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px">날짜</label>'+
    '<input type="date" value="'+asDate+'" onchange="asDate=this.value;renderView()" '+
    'style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px"></div>';

  if(!classes.length){
    v.innerHTML=html+'<div class="empty"><div class="empty-ico">'+ic('calendar',44)+'</div>'+
      '<span>이 날은 방과후 수업이 없습니다</span></div>';
    return;
  }

  var mem=await FS.members();
  var recs=await FS.checkIns(asDate);
  var checked={};   // 수업명 -> {이름:1}
  recs.forEach(function(r){ (checked[r.subject]=checked[r.subject]||{})[r.name]=1; });

  var past = asDate < kstToday();   // 지난 날짜는 결석이 확정된 상태

  classes.forEach(function(c){
    var track=classTrack(c);
    var roster=mem.filter(function(m){return track==='공통'||m.track===track;});
    var map=checked[c.subject]||{};
    var present=roster.filter(function(m){return map[m.name];}).length;
    var absent=roster.length-present;

    html+='<div class="sec-label">'+c.subject+
      ' <span style="font-weight:500;color:var(--ink-mute)">· '+track+'</span></div>'+
      '<div class="card">'+
        '<div class="blk"><div class="blk-head">'+
          '<div class="row-t">출석 '+present+' / '+roster.length+'명</div>'+
          '<div class="row-v" style="color:'+(absent?'var(--rose)':'var(--green)')+'">'+
            (absent? (past?'결석 '+absent:'미체크 '+absent) : '전원 출석')+'</div>'+
        '</div></div>'+
        roster.map(function(m){
          var ok=!!map[m.name];
          var label=ok?'출석':(past?'결석':'미체크');
          var color=ok?'#16a34a':(past?'var(--rose)':'var(--ink-mute)');
          var bg=ok?'var(--green-soft)':(past?'var(--rose-soft)':'var(--line-soft)');
          return '<div class="row" style="cursor:default"><div class="avatar">'+m.name.charAt(0)+'</div>'+
            '<div class="row-main"><div class="row-t">'+m.name+'</div>'+
            '<div class="row-s">'+m.track+'반</div></div>'+
            '<span class="chip" style="background:'+bg+';color:'+color+'">'+label+'</span></div>';
        }).join('')+
      '</div>';
  });

  if(!past) html+='<div class="notice" style="color:var(--ink-mute);cursor:default">'+ic('clock',15)+
    '<span>오늘 24시가 지나면 미체크는 결석으로 확정됩니다</span></div>';
  v.innerHTML=html;
}

/* ═══ 전환 ═══ */
function enterApp(role){ROLE=role;TAB='home';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyRole();protoSync();}
function setRole(r){ROLE=r;TAB='home';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyRole();protoSync();}
function applyRole(){
  var t=ROLE==='teacher';
  document.getElementById('uName').textContent = t?'교사':ME.name;
  document.getElementById('uRole').textContent = t?'장원급제반 담임':(ME.track+'반');
  document.getElementById('uStreak').style.display = t?'none':'';
  document.getElementById('btnReq').style.display = t?'':'none';
  renderTabs();renderView();
}
function logout(){document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');protoSync();}
function protoSync(){
  var on=document.getElementById('login').classList.contains('hidden')?(ROLE==='student'?0:1):2;
  var b=document.querySelectorAll('#proto button');
  for(var i=0;i<b.length;i++)b[i].className=(i===on?'on':'');
}
/* 푸시 알림 딥링크: ?goto=after&date=YYYY-MM-DD */
function applyDeepLink(){
  var q=new URLSearchParams(location.search);
  var goto=q.get('goto'); if(!goto) return;
  var d=q.get('date'); if(d) asDate=d;
  TAB=goto;
}
applyDeepLink();
fillIcoSlots();
