<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>장원급제반</title>
<style>
@font-face{
  font-family:'Pretendard';
  src:url('fonts/PretendardVariable.woff2') format('woff2');
  font-weight:45 920; font-style:normal; font-display:swap;
}

:root{
  --ink:#1a1a2e; --ink-soft:#4a4a6a; --ink-mute:#6b6b83;
  --line:#e8e8f0; --line-soft:#f2f2f8; --bg:#f7f7fc; --surface:#ffffff;
  --accent:#5b6af0; --accent-soft:#eef0ff; --accent-hover:#4555e8;
  --green:#22c55e; --green-soft:#dcfce7;
  --orange:#f97316; --orange-soft:#ffedd5;
  --rose:#f43f5e; --rose-soft:#ffe4e6;
  --sky:#0ea5e9; --sky-soft:#e0f2fe;
  --gold:#b8860b; --gold-soft:#fdf3d8;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:14px; --radius-sm:8px;
  --shadow:0 2px 12px rgba(26,26,46,0.07); --shadow-md:0 4px 24px rgba(26,26,46,0.1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.2px;}
body{display:flex;justify-content:center;min-height:100vh;}
#app,#login{width:100%;max-width:430px;background:var(--bg);}
@media(min-width:600px){#app,#login{max-width:600px;}}
.hidden{display:none !important;}
input,select,textarea{font-family:inherit;font-size:16px;}
.ico{display:block;flex-shrink:0;}

/* ── 로그인 ───────────────────────────────── */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:32px 24px calc(32px + var(--safe-bottom));background:var(--surface);}
.login-brand{text-align:center;margin-bottom:36px;}
.login-mark{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--accent);}
.login-title{font-size:1.55rem;font-weight:800;letter-spacing:-0.5px;}
.login-sub{font-size:0.86rem;color:var(--ink-mute);margin-top:6px;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
input[type=text],input[type=tel],select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);color:var(--ink);background:var(--surface);outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,106,240,.1);}
input::placeholder{color:#b4b4c8;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 20px;
  background:var(--accent);color:#fff;border:none;font-family:inherit;font-size:0.95rem;font-weight:600;
  cursor:pointer;border-radius:var(--radius-sm);transition:background .2s,transform .1s,box-shadow .2s;margin-top:8px;}
.btn:hover{background:var(--accent-hover);box-shadow:0 4px 16px rgba(91,106,240,.3);}
.btn:active{transform:scale(.98);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);}
.btn-outline:hover{background:var(--line-soft);box-shadow:none;border-color:var(--ink-mute);}
.btn-sm{width:auto;padding:8px 14px;font-size:0.8rem;margin:0;}
.login-divider{display:flex;align-items:center;gap:12px;margin:24px 0 16px;color:var(--ink-mute);font-size:0.76rem;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line);}

/* ── 헤더 + 탭바 ──────────────────────────── */
.header{background:var(--surface);padding:0 18px;padding-top:calc(14px + var(--safe-top));
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;}
.h-name{font-size:1.22rem;font-weight:800;letter-spacing:-0.4px;line-height:1.2;}
.h-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.h-role{font-size:0.76rem;color:var(--ink-mute);}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:0.7rem;font-weight:700;
  padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);}
.chip-gold{background:var(--gold-soft);color:var(--gold);}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--ink-mute);
  border-radius:8px;transition:background .15s,color .15s;position:relative;}
.icon-btn:hover{background:var(--line-soft);color:var(--ink);}
.dot-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;
  background:var(--rose);color:#fff;font-size:0.6rem;font-weight:700;line-height:16px;text-align:center;padding:0 4px;}

.tab-bar{display:flex;}
.tab-btn{flex:1;min-width:0;padding:11px 2px 9px;background:transparent;border:none;
  border-bottom:2.5px solid transparent;font-family:inherit;font-size:0.7rem;font-weight:500;
  color:var(--ink-mute);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  transition:color .15s,border-color .15s;}
.tab-btn .ico{transition:transform .15s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab-btn.active .ico{transform:scale(1.08) translateY(-1px);}

/* ── 본문 ─────────────────────────────────── */
main{padding:14px 16px calc(28px + var(--safe-bottom));}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:10px;}
.sec-label{font-size:0.75rem;font-weight:700;color:var(--ink-mute);letter-spacing:.5px;
  margin:18px 2px 8px;text-transform:uppercase;}
.sec-label:first-child{margin-top:2px;}

/* 배너 */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;cursor:pointer;
  font-size:0.86rem;font-weight:600;transition:transform .1s;}
.banner:active{transform:scale(.99);}
.banner-accent{background:var(--accent-soft);color:var(--accent);}
.banner-gold{background:var(--gold-soft);color:var(--gold);}
.banner-arrow{font-size:0.8rem;font-weight:700;white-space:nowrap;opacity:.8;}

/* 통계 2열 */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:5px;min-height:104px;
  cursor:pointer;transition:border-color .15s,transform .1s;}
.stat-card:active{transform:scale(.98);}
.stat-card:hover{border-color:var(--accent);}
.stat-lbl{font-size:0.73rem;color:var(--ink-mute);font-weight:600;}
.stat-num{font-size:1.85rem;font-weight:800;line-height:1;letter-spacing:-1px;}
.stat-unit{font-size:0.95rem;font-weight:700;margin-left:1px;}
.stat-ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;}

/* 메뉴 타일 */
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 14px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;text-align:left;
  display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .1s;}
.tile:hover{border-color:var(--accent);}
.tile:active{transform:scale(.98);}
.tile-ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;margin-bottom:6px;background:var(--accent-soft);color:var(--accent);}
.tile-ico.g{background:var(--green-soft);color:#16a34a;}
.tile-ico.o{background:var(--orange-soft);color:var(--orange);}
.tile-ico.s{background:var(--sky-soft);color:var(--sky);}
.tile-ico.r{background:var(--rose-soft);color:var(--rose);}
.tile-ico.y{background:var(--gold-soft);color:var(--gold);}
.tile-lbl{font-size:0.9rem;font-weight:700;color:var(--ink);}
.tile-desc{font-size:0.72rem;color:var(--ink-mute);}

/* 리스트 아이템 */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface);cursor:pointer;margin-bottom:6px;
  transition:border-color .15s,background .15s;}
.list-item:hover{border-color:var(--accent);background:var(--accent-soft);}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;flex-shrink:0;}
.li-main{flex:1;min-width:0;}
.li-name{font-size:0.92rem;font-weight:700;}
.li-sub{font-size:0.74rem;color:var(--ink-mute);margin-top:2px;}

/* 체크인 버튼 */
.checkin{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:17px 18px;
  cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(91,106,240,.25);
  transition:transform .1s,box-shadow .2s;margin-bottom:10px;}
.checkin:active{transform:scale(.99);}
.checkin.done{background:var(--green-soft);color:#16a34a;box-shadow:none;cursor:default;}
.checkin-t{font-size:1rem;font-weight:700;}
.checkin-s{font-size:0.75rem;opacity:.85;margin-top:3px;}

/* 진행바 */
.bar{background:var(--line-soft);border-radius:6px;height:8px;overflow:hidden;margin-top:8px;}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s;}
.bar>i.g{background:var(--green);} .bar>i.o{background:var(--orange);}

/* 주간 도트 */
.week-row{display:flex;justify-content:space-between;gap:6px;margin-top:12px;}
.day{flex:1;text-align:center;}
.day-lbl{font-size:0.68rem;color:var(--ink-mute);margin-bottom:5px;}
.day-dot{width:100%;aspect-ratio:1;max-width:34px;margin:0 auto;border-radius:11px;
  display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;
  background:var(--line-soft);color:var(--ink-mute);}
.day-dot.ok{background:var(--green-soft);color:#16a34a;}
.day-dot.late{background:var(--orange-soft);color:var(--orange);}
.day-dot.no{background:var(--rose-soft);color:var(--rose);}
.day-dot.today{outline:2px solid var(--accent);outline-offset:1px;}

.empty{text-align:center;color:var(--ink-mute);padding:44px 20px;font-size:0.86rem;line-height:1.9;}
.empty-ico{display:flex;justify-content:center;margin-bottom:10px;opacity:.5;color:var(--accent);}

/* 뷰 전환 (프로토타입 전용) */
#proto{position:fixed;bottom:calc(14px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);border-radius:22px;padding:5px;display:flex;gap:3px;z-index:500;
  box-shadow:0 8px 30px rgba(0,0,0,.25);}
#proto button{background:none;border:none;color:rgba(255,255,255,.55);font-family:inherit;
  font-size:0.74rem;font-weight:600;padding:7px 14px;border-radius:18px;cursor:pointer;white-space:nowrap;}
#proto button.on{background:rgba(255,255,255,.16);color:#fff;}
</style>
</head>
<body>

<!-- ══════════ 로그인 ══════════ -->
<div id="login">
  <div class="login-brand">
    <div class="login-mark"><span class="ico-slot" data-ico="cap" data-sz="32"></span></div>
    <div class="login-title">장원급제반</div>
    <div class="login-sub">청양고등학교 · 공직의 길을 걷는 자</div>
  </div>
  <div class="field"><label>학번</label><input type="text" placeholder="예: 20301" inputmode="numeric"></div>
  <div class="field"><label>이름</label><input type="text" placeholder="이름을 입력하세요"></div>
  <button class="btn" onclick="enterApp('student')">입실하기</button>
  <div class="login-divider">또는</div>
  <button class="btn btn-outline" onclick="enterApp('teacher')">
    <span class="ico-slot" data-ico="person" data-sz="17"></span>교사로 입실
  </button>
  <button class="btn btn-outline" onclick="enterApp('teacher')">
    <span class="ico-slot" data-ico="cap" data-sz="17"></span>방과후 강사 로그인
  </button>
</div>

<!-- ══════════ 앱 ══════════ -->
<div id="app" class="hidden">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="h-name" id="uName">맹진우</div>
        <div class="h-meta">
          <span class="h-role" id="uRole">공기업반 · 관원</span>
          <span class="chip chip-gold" id="uStreak">🔥 3일 연속</span>
        </div>
      </div>
      <div style="display:flex;gap:2px;">
        <button class="icon-btn" id="btnReq" style="display:none">
          <span class="ico-slot" data-ico="memo" data-sz="21"></span><span class="dot-badge">2</span>
        </button>
        <button class="icon-btn"><span class="ico-slot" data-ico="bell" data-sz="21"></span></button>
        <button class="icon-btn" onclick="logout()"><span class="ico-slot" data-ico="exit" data-sz="21"></span></button>
      </div>
    </div>
    <div class="tab-bar" id="tabBar"></div>
  </div>
  <main id="view"></main>
</div>

<!-- 프로토타입 전환 -->
<div id="proto">
  <button class="on" onclick="setRole('student')">학생 화면</button>
  <button onclick="setRole('teacher')">교사 화면</button>
  <button onclick="logout()">로그인</button>
</div>

<script>
/* ═══ 아이콘 (상담일지앱 세트 + 장원급제반 전용 자체제작) ═══ */
var ICONS = {
  /* 상담일지앱에서 가져온 것 */
  person:'<circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/>',
  people:'<circle cx="9" cy="8" r="3"/><path d="M3.6 19c0-3 2.4-5.2 5.4-5.2s5.4 2.2 5.4 5.2"/><path d="M16.2 5.4a3 3 0 0 1 0 5.5"/><path d="M17.3 14.2c1.9.6 3.3 2.3 3.3 4.5"/>',
  chart:'<rect x="4.5" y="11" width="3.6" height="8" rx="1.2"/><rect x="10.2" y="6.5" width="3.6" height="12.5" rx="1.2"/><rect x="15.9" y="13.5" width="3.6" height="5.5" rx="1.2"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 9.5h17"/><line x1="8" y1="3" x2="8" y2="6.2"/><line x1="16" y1="3" x2="16" y2="6.2"/>',
  clipboard:'<rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V4.2A1.2 1.2 0 0 1 10.2 3h3.6A1.2 1.2 0 0 1 15 4.2V5"/><path d="M8.5 11h7M8.5 14.5h5"/>',
  chat:'<path d="M20 4H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3v4l4.5-4H20a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>',
  memo:'<path d="M6 3.5h7L18.5 9v10.5a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 6 3.5z"/><path d="M13 3.5V9h5.5"/><path d="M8 13h7M8 16.5h5"/>',
  bell:'<path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>',
  cap:'<path d="M2.5 8.5 12 4.7l9.5 3.8L12 12.3 2.5 8.5z"/><path d="M6 10.5v4.2c0 1.3 2.7 2.6 6 2.6s6-1.3 6-2.6v-4.2"/><path d="M21.5 8.7v5.3"/>',
  clock:'<circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3.2 2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  check:'<path d="M4.5 12.5l5 5 10-11"/>',
  /* 장원급제반 전용 — 같은 톤(24px, stroke 1.9)으로 자체 제작 */
  coin:'<ellipse cx="12" cy="12" rx="8.2" ry="8.2"/><path d="M12 7.6v8.8M9.4 9.6h3.4a1.9 1.9 0 0 1 0 3.8H9.4"/>',
  market:'<path d="M4 8.5h16l-1 10.2a1.6 1.6 0 0 1-1.6 1.4H6.6A1.6 1.6 0 0 1 5 18.7L4 8.5z"/><path d="M8.6 8.5V6.4a3.4 3.4 0 0 1 6.8 0v2.1"/>',
  qr:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><path d="M13.5 13.5h3v3h-3z"/><path d="M20.5 13.5v3M17 20.5h3.5"/>',
  exit:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  bank:'<path d="M3.5 9.5 12 4.5l8.5 5"/><path d="M5.5 9.5v9M10 9.5v9M14 9.5v9M18.5 9.5v9"/><path d="M3 20.5h18"/>'
};
function ic(n,s){return '<svg class="ico" width="'+(s||18)+'" height="'+(s||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
function fillIcoSlots(root){
  var els=(root||document).querySelectorAll('.ico-slot[data-ico]');
  for(var i=0;i<els.length;i++){var el=els[i];if(el.__f)continue;
    el.innerHTML=ic(el.getAttribute('data-ico'),parseInt(el.getAttribute('data-sz'),10)||18);el.__f=1;}
}

/* ═══ 데모 데이터 (실데이터 기반) ═══ */
var ROLE='student', TAB='home';
var ME={name:'맹진우',track:'공기업',coins:-3,bank:5,streak:3,
  week:[{d:'월',s:'ok'},{d:'화',s:'ok'},{d:'수',s:'late'},{d:'목',s:'ok'},{d:'금',s:'today'}],
  planner:{done:2,total:5}};
var STUDENTS=[{n:'맹진우',t:'공기업',c:-3},{n:'안성현',t:'공기업',c:-24},{n:'전규비',t:'공무원',c:8},
  {n:'정여원',t:'공무원',c:11},{n:'명지희',t:'공기업',c:-3},{n:'박현서',t:'공기업',c:0}];

var TABS={
  student:[['home','홈','clipboard'],['exam','성적','chart'],['market','저잣거리','market'],
           ['coin','엽전','coin'],['after','방과후','calendar']],
  teacher:[['home','집무실','clipboard'],['att','출결','check'],['coin','엽전','coin'],
           ['counsel','상담','chat'],['exam','성적','chart']]
};

/* ═══ 렌더 ═══ */
function renderTabs(){
  document.getElementById('tabBar').innerHTML = TABS[ROLE].map(function(t){
    return '<button class="tab-btn'+(t[0]===TAB?' active':'')+'" onclick="go(\''+t[0]+'\')">'+
           ic(t[2],20)+'<span>'+t[1]+'</span></button>';
  }).join('');
}
function go(t){TAB=t;renderTabs();renderView();window.scrollTo(0,0);}

function renderView(){
  var v=document.getElementById('view');
  if(TAB!=='home'){v.innerHTML=stub();fillIcoSlots(v);return;}
  v.innerHTML = ROLE==='student' ? homeStudent() : homeTeacher();
  fillIcoSlots(v);
}

function homeStudent(){
  var p=ME.planner, pct=Math.round(p.done/p.total*100);
  return ''+
  '<div class="banner banner-gold"><span>🔔 알림 켜고 등교·방과후 소식 받기</span><span class="banner-arrow">켜기 →</span></div>'+

  '<button class="checkin">'+
    '<div style="text-align:left"><div class="checkin-t">등교 인증하기</div>'+
    '<div class="checkin-s">08:10까지 인증하면 출석 +1냥</div></div>'+
    ic('check',26)+'</button>'+

  '<div class="stat-row">'+
    '<div class="stat-card"><div class="stat-lbl">내 엽전</div>'+
      '<div class="stat-num" style="color:'+(ME.coins<0?'var(--rose)':'var(--ink)')+'">'+ME.coins+'<span class="stat-unit">냥</span></div>'+
      '<div class="stat-lbl" style="font-size:.68rem">은행 '+ME.bank+'냥 저축중</div></div>'+
    '<div class="stat-card"><div class="stat-ico">'+ic('qr',21)+'</div>'+
      '<div class="tile-lbl">내 QR코드</div><div class="tile-desc">저잣거리에서 사용</div></div>'+
  '</div>'+

  '<div class="card">'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div><div class="tile-lbl">오늘의 플래너</div>'+
      '<div class="tile-desc" style="margin-top:2px">'+p.done+' / '+p.total+'개 완료 · 100% 달성 시 +2냥</div></div>'+
      '<div style="font-size:1.4rem;font-weight:800;color:'+(pct===100?'var(--green)':'var(--accent)')+'">'+pct+'%</div>'+
    '</div>'+
    '<div class="bar"><i class="'+(pct===100?'g':'')+'" style="width:'+pct+'%"></i></div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="tile-lbl">이번 주 출결</div>'+
    '<div class="week-row">'+ME.week.map(function(d){
      var cls=d.s==='today'?'today':d.s;
      var txt=d.s==='ok'?'출':d.s==='late'?'지':d.s==='no'?'결':'·';
      return '<div class="day"><div class="day-lbl">'+d.d+'</div><div class="day-dot '+cls+'">'+txt+'</div></div>';
    }).join('')+'</div>'+
  '</div>'+

  '<div class="sec-label">바로가기</div>'+
  '<div class="tile-grid">'+
    tile('coin','y','엽전 안내','받는 법 · 차감')+
    tile('calendar','s','방과후 시간표','이번 달 일정')+
    tile('bank','g','엽전 은행','저축 · 이자')+
    tile('chart','o','내 성적','모의고사 추이')+
  '</div>';
}

function homeTeacher(){
  return ''+
  '<div class="banner banner-accent"><span>📋 승인 대기 중인 엽전 요청 2건</span><span class="banner-arrow">확인 →</span></div>'+
  '<div class="stat-row">'+
    '<div class="stat-card"><div class="stat-lbl">오늘 출석</div><div class="stat-num">9<span class="stat-unit">/13</span></div>'+
      '<div class="stat-lbl" style="font-size:.68rem;color:var(--orange)">지각 2 · 결석 2</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">이번 주 상담</div><div class="stat-num">5<span class="stat-unit">건</span></div>'+
      '<div class="stat-lbl" style="font-size:.68rem">미완료 8명</div></div>'+
  '</div>'+
  '<div class="sec-label">학생 빠른 조회</div>'+
  STUDENTS.map(function(s){
    return '<div class="list-item"><div class="avatar">'+s.n.charAt(0)+'</div>'+
      '<div class="li-main"><div class="li-name">'+s.n+'</div>'+
      '<div class="li-sub">'+s.t+'반</div></div>'+
      '<div style="font-weight:700;font-size:.9rem;color:'+(s.c<0?'var(--rose)':'var(--ink-soft)')+'">'+s.c+'냥</div></div>';
  }).join('')+
  '<div class="sec-label">관리</div>'+
  '<div class="tile-grid">'+
    tile('coin','y','엽전 지급','일괄 지급 · 기록')+
    tile('market','o','저잣거리','상품 · 재고 관리')+
    tile('calendar','s','방과후 일정','시간표 · 출석체크')+
    tile('gear','r','집무실','설정 · 학년도 전환')+
  '</div>';
}

function tile(icon,color,lbl,desc){
  return '<button class="tile"><div class="tile-ico '+color+'">'+ic(icon,19)+'</div>'+
    '<div class="tile-lbl">'+lbl+'</div><div class="tile-desc">'+desc+'</div></button>';
}
function stub(){
  return '<div class="empty"><div class="empty-ico">'+ic('clipboard',44)+'</div>'+
    '<span>이 화면은 다음 단계에서 만듭니다<br>지금은 홈 화면 디자인만 확인해주세요</span></div>';
}

/* ═══ 전환 ═══ */
function enterApp(role){ROLE=role;TAB='home';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyRole();protoSync();}
function setRole(r){ROLE=r;TAB='home';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyRole();protoSync();}
function applyRole(){
  var t=ROLE==='teacher';
  document.getElementById('uName').textContent = t?'교사':ME.name;
  document.getElementById('uRole').textContent = t?'장원급제반 담임':(ME.track+'반 · 관원');
  document.getElementById('uStreak').style.display = t?'none':'';
  document.getElementById('btnReq').style.display = t?'':'none';
  renderTabs();renderView();
}
function logout(){document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');protoSync();}
function protoSync(){
  var on=document.getElementById('login').classList.contains('hidden')?(ROLE==='student'?0:1):2;
  var b=document.querySelectorAll('#proto button');
  for(var i=0;i<b.length;i++)b[i].className=(i===on?'on':'');
}
fillIcoSlots();
</script>
