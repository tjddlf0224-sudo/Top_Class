<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>장원급제반</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b6af0">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
@font-face{
  font-family:'Pretendard';
  src:url('fonts/PretendardVariable.woff2') format('woff2');
  font-weight:45 920; font-style:normal; font-display:swap;
}

:root{
  --ink:#1a1a2e; --ink-soft:#4a4a6a; --ink-mute:#6b6b83;
  --line:#e8e8f0; --line-soft:#f2f2f8; --bg:#f7f7fc; --surface:#ffffff;
  --accent:#5b6af0; --accent-soft:#eef0ff; --accent-hover:#4555e8;
  --green:#22c55e; --green-soft:#dcfce7;
  --orange:#f97316; --orange-soft:#ffedd5;
  --rose:#f43f5e; --rose-soft:#ffe4e6;
  --sky:#0ea5e9; --sky-soft:#e0f2fe;
  --gold:#b8860b; --gold-soft:#fdf3d8;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:14px; --radius-sm:8px;
  --shadow:0 2px 12px rgba(26,26,46,0.07); --shadow-md:0 4px 24px rgba(26,26,46,0.1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.2px;}
body{display:flex;justify-content:center;min-height:100vh;}
#app,#login{width:100%;max-width:430px;background:var(--bg);}
@media(min-width:600px){#app,#login{max-width:600px;}}
.hidden{display:none !important;}
input,select,textarea{font-family:inherit;font-size:16px;}
.ico{display:block;flex-shrink:0;}

/* ── 로그인 ───────────────────────────────── */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:32px 24px calc(32px + var(--safe-bottom));background:var(--surface);}
.login-brand{text-align:center;margin-bottom:36px;}
.login-mark{width:72px;height:72px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;}
.login-mark img{display:block;width:72px;height:72px;}
.login-title{font-size:1.55rem;font-weight:800;letter-spacing:-0.5px;}
.login-sub{font-size:0.86rem;color:var(--ink-mute);margin-top:6px;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
input[type=text],input[type=tel],input[type=password],select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);color:var(--ink);background:var(--surface);outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,106,240,.1);}
input::placeholder{color:#b4b4c8;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 20px;
  background:var(--accent);color:#fff;border:none;font-family:inherit;font-size:0.95rem;font-weight:600;
  cursor:pointer;border-radius:var(--radius-sm);transition:background .2s,transform .1s,box-shadow .2s;margin-top:8px;}
.btn:hover{background:var(--accent-hover);box-shadow:0 4px 16px rgba(91,106,240,.3);}
.btn:active{transform:scale(.98);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);}
.btn-outline:hover{background:var(--line-soft);box-shadow:none;border-color:var(--ink-mute);}
.btn-sm{width:auto;padding:8px 14px;font-size:0.8rem;margin:0;}
.login-divider{display:flex;align-items:center;gap:12px;margin:24px 0 16px;color:var(--ink-mute);font-size:0.76rem;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line);}
.login-err{background:var(--rose-soft);color:var(--rose);font-size:0.8rem;font-weight:600;
  padding:10px 12px;border-radius:8px;margin-bottom:10px;}

/* ── 헤더 + 탭바 ──────────────────────────── */
.header{background:var(--surface);padding:0 18px;padding-top:calc(14px + var(--safe-top));
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;}
.h-name{font-size:1.22rem;font-weight:800;letter-spacing:-0.4px;line-height:1.2;}
.h-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.h-role{font-size:0.76rem;color:var(--ink-mute);}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:0.7rem;font-weight:700;
  padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);}
.chip-gold{background:var(--gold-soft);color:var(--gold);}
.chip-risk{background:var(--rose-soft);color:var(--rose);animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:9990;padding:20px;
  padding-top:calc(20px + var(--safe-top));overflow-y:auto;}
.modal-box{background:var(--surface);border-radius:18px;padding:22px;width:100%;max-width:380px;
  box-shadow:0 20px 60px rgba(26,26,46,.2);}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--ink-mute);
  border-radius:8px;transition:background .15s,color .15s;position:relative;}
.icon-btn:hover{background:var(--line-soft);color:var(--ink);}
.dot-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;
  background:var(--rose);color:#fff;font-size:0.6rem;font-weight:700;line-height:16px;text-align:center;padding:0 4px;}

.tab-bar{display:flex;}
.tab-btn{flex:1;min-width:0;padding:11px 2px 9px;background:transparent;border:none;
  border-bottom:2.5px solid transparent;font-family:inherit;font-size:0.7rem;font-weight:500;
  color:var(--ink-mute);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  transition:color .15s,border-color .15s;}
.tab-btn .ico{transition:transform .15s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab-btn.active .ico{transform:scale(1.08) translateY(-1px);}

/* ── 본문 ─────────────────────────────────── */
main{padding:6px 18px calc(32px + var(--safe-bottom));}
.sec-label{font-size:0.74rem;font-weight:700;color:var(--ink-mute);letter-spacing:.3px;
  margin:26px 2px 10px;}

/* 히어로 — 박스 없이 배경 위에 바로 */
.hero{padding:14px 2px 20px;}
.hero-lbl{font-size:0.76rem;color:var(--ink-mute);font-weight:600;}
.hero-num{font-size:2.7rem;font-weight:800;letter-spacing:-2px;line-height:1.05;margin-top:5px;}
.hero-num small{font-size:1.05rem;font-weight:700;letter-spacing:0;margin-left:3px;}
.hero-sub{font-size:0.78rem;color:var(--ink-mute);margin-top:8px;}
.hero-inline{display:flex;gap:22px;margin-top:16px;}
.hero-inline div{font-size:0.78rem;color:var(--ink-mute);font-weight:600;}
.hero-inline b{display:block;font-size:1.25rem;color:var(--ink);letter-spacing:-.5px;margin-top:2px;}

/* 카드 = 행 묶음 (테두리 없이 아주 옅은 그림자만) */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:12px;padding:0 18px;}
.card.pad{padding:18px;}
.row{display:flex;align-items:center;gap:13px;padding:16px 0;border-top:1px solid var(--line-soft);
  cursor:pointer;}
.row:first-child{border-top:none;}
.blk{padding:17px 0;border-top:1px solid var(--line-soft);}
.blk:first-child{border-top:none;}
.blk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.row-main{flex:1;min-width:0;}
.row-t{font-size:0.92rem;font-weight:700;}
.row-s{font-size:0.75rem;color:var(--ink-mute);margin-top:3px;}
.row-v{font-size:1.05rem;font-weight:800;letter-spacing:-.5px;white-space:nowrap;}
.row-chev{color:#c8c8d8;flex-shrink:0;}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.88rem;flex-shrink:0;}

/* 체크인 — 화면의 유일한 강조 버튼 */
.checkin{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:18px;
  cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(91,106,240,.28);
  transition:transform .1s;margin-bottom:4px;}
.checkin:active{transform:scale(.99);}
.checkin.done{background:var(--green-soft);color:#16a34a;box-shadow:none;cursor:default;}
.checkin-t{font-size:1.02rem;font-weight:700;}
.checkin-s{font-size:0.76rem;opacity:.85;margin-top:4px;}

/* 진행바 */
.bar{background:var(--line-soft);border-radius:6px;height:7px;overflow:hidden;margin-top:10px;}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s;}
.bar>i.g{background:var(--green);}

/* 주간 도트 */
.week-row{display:flex;gap:7px;margin-top:13px;}
.day{flex:1;text-align:center;}
.day-lbl{font-size:0.68rem;color:var(--ink-mute);margin-bottom:6px;}
.day-dot{width:100%;aspect-ratio:1;max-width:36px;margin:0 auto;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;
  background:var(--line-soft);color:#c0c0d0;}
.day-dot.ok{background:var(--green-soft);color:#16a34a;}
.day-dot.late{background:var(--orange-soft);color:var(--orange);}
.day-dot.no{background:var(--rose-soft);color:var(--rose);}
.day-dot.today{outline:2px solid var(--accent);outline-offset:2px;}

/* 바로가기 — 박스 없이 아이콘 한 줄 */
.quick{display:flex;gap:2px;}
.quick button{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;transition:transform .1s;}
.quick button:active{transform:scale(.94);}
.qi{width:50px;height:50px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);}
.qi.g{background:var(--green-soft);color:#16a34a;} .qi.o{background:var(--orange-soft);color:var(--orange);}
.qi.s{background:var(--sky-soft);color:var(--sky);} .qi.y{background:var(--gold-soft);color:var(--gold);}
.qi.r{background:var(--rose-soft);color:var(--rose);}
.ql{font-size:0.72rem;font-weight:600;color:var(--ink-soft);}

/* 알림 한 줄 (배너 박스 대신) */
.notice{display:flex;align-items:center;gap:7px;padding:11px 2px;font-size:0.8rem;
  font-weight:600;color:var(--gold);cursor:pointer;}
.notice.accent{color:var(--accent);}

.empty{text-align:center;color:var(--ink-mute);padding:44px 20px;font-size:0.86rem;line-height:1.9;}
.empty-ico{display:flex;justify-content:center;margin-bottom:10px;opacity:.5;color:var(--accent);}

/* 뷰 전환 (프로토타입 전용) */
#proto{position:fixed;bottom:calc(14px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);border-radius:22px;padding:5px;display:flex;gap:3px;z-index:500;
  box-shadow:0 8px 30px rgba(0,0,0,.25);}
#proto button{background:none;border:none;color:rgba(255,255,255,.55);font-family:inherit;
  font-size:0.74rem;font-weight:600;padding:7px 14px;border-radius:18px;cursor:pointer;white-space:nowrap;}
#proto button.on{background:rgba(255,255,255,.16);color:#fff;}
</style>
</head>

  </div>

</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="h-name" id="uName"></div>
        <div class="h-meta">
          <span class="h-role" id="uRole">공기업반</span>

        <button class="icon-btn" id="btnReq" style="display:none">

</div>


<!-- ═══ Firebase (조회·체크인 전부 여기로. GAS 안 거침) ═══ -->
<script type="module">
import { initializeApp } from "./vendor/firebase/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp }
  from "./vendor/firebase/firebase-firestore.js";
import { initializeAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword,
         signOut, browserLocalPersistence, indexedDBLocalPersistence }
  from "./vendor/firebase/firebase-auth.js";

/* GAS가 배열·객체를 JSON 문자열로 저장하므로(schedule/attendance 동일 패턴) 읽을 때 되돌린다 */
function parseObj(v){
  if (v && typeof v === 'object') return v;
  try { const p = JSON.parse(v); return (p && typeof p === 'object') ? p : {}; } catch(e){ return {}; }
}
function parseList(v){
  if (Array.isArray(v)) return v;
  try { const p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch(e){ return []; }
}

/* ⚠️ v2는 GAS를 전혀 호출하지 않는다. 조회도 쓰기도 전부 Firestore 직통이다.
   (마지막까지 남아 있던 프리즈 구매까지 2026-09-14에 Firestore로 옮겼다.)
   GAS는 구앱 전용으로만 남아 있고, 구앱이 은퇴하면 트리거·푸시만 남는다. */

const fbApp = initializeApp({
  apiKey:"AIzaSyDRViuzADHxHnvv78jfnvPbAJ5hH3wzpCw",
  authDomain:"topclass-be740.firebaseapp.com",
  projectId:"topclass-be740",
  storageBucket:"topclass-be740.firebasestorage.app",
  messagingSenderId:"662651378616",
  appId:"1:662651378616:web:6eceb1505265c0700bcd4d"
});
const db   = getFirestore(fbApp);

/* ⚠️ getAuth()가 아니라 initializeAuth()를 쓴다.
   getAuth()는 팝업 리다이렉트 리졸버를 함께 붙이는데, 그게 authDomain에서
   인증 iframe을 불러온다. 설치된 앱(WKWebView, origin이 capacitor://localhost)에서는
   그 iframe이 끝내 응답하지 않아 **인증 초기화가 통째로 멈춘다**.
   실측: getAuth는 setPersistence조차 타임아웃, initializeAuth는 3초 만에 익명 로그인 성공.
   우리는 팝업 로그인(구글·애플)을 쓰지 않으므로 리졸버가 필요 없다. */
const auth = initializeAuth(fbApp, {
  persistence: [indexedDBLocalPersistence, browserLocalPersistence]
});

/* ═══ 신원 확인 ═══════════════════════════════════════
   학생 = 익명 인증. 화면에는 아무것도 드러나지 않고, 보안규칙이
          "이 앱에서 온 요청"만 받아들이게 하는 용도다.
   교사 = 이메일·비밀번호. 출석 정정처럼 교사만 해야 하는 쓰기를
          규칙에서 실제로 막으려면 익명끼리는 구분이 안 된다.

   ⚠️ 이메일/비밀번호 제공업체가 켜져 있으면 누구나 스스로 계정을
      만들 수 있다. 따라서 "이메일 계정이 있다 = 교사"가 아니며,
      아래 UID 화이트리스트(또는 admins 문서)로만 교사를 판정한다.
   ⚠️ 구앱(index.html)은 인증을 전혀 쓰지 않는다. 구앱이 건드리는
      schedule 쓰기와 모든 읽기 권한은 규칙에서 손대지 말 것. */
const TEACHER_UID = 'c5BpZGuLVtZmKep0xq3DVeCUBij1';

let _isTeacher = false;

/* 화이트리스트 UID이거나, 콘솔에서 만든 admins/{uid} 문서가 있으면 교사.
   admins 경로를 같이 두는 이유: 방과후 강사를 추가할 때 규칙을 다시
   게시하지 않고 문서 하나만 만들면 되게 하려는 것. */
async function verifyTeacher(u){
  if (!u || u.isAnonymous) return false;
  if (u.uid === TEACHER_UID) return true;
  try { return (await getDoc(doc(db,'admins',u.uid))).exists(); } catch(e){ return false; }
}

/* 앱이 뜨자마자 조용히 익명 로그인한다.
   이미 교사로 로그인한 기기라면 그 세션이 그대로 살아난다. */
function _boot(){
  // 저장소는 initializeAuth에서 이미 지정했다(IndexedDB 우선, 안 되면 localStorage).
  return new Promise(function(res){
      const off = onAuthStateChanged(auth, function(u){ off(); res(u); });
    })
    .then(function(u){
      if (u) return u;
      return signInAnonymously(auth).then(function(c){ return c.user; })
                                    .catch(function(){ return null; });
    })
    .then(async function(u){ _isTeacher = await verifyTeacher(u); return u; });
}

/* 인증이 끝내 응답하지 않아도 앱이 멈추면 안 된다 — 조회는 대부분 공개 읽기라
   인증 없이도 화면은 뜬다(쓰기만 규칙에 막힌다). */
function _bootGuarded(){
  return Promise.race([
    _boot(),
    new Promise(function(res){ setTimeout(function(){ res(null); }, 12000); })
  ]);
}
let _authReady = _bootGuarded();

window.AUTH = {
  /* 인증이 끝날 때까지 기다린다. 쓰기 전에 반드시 거칠 것 */
  ready(){ return _authReady; },
  user(){ return auth.currentUser; },
  isTeacher(){ return _isTeacher; },

  async signInTeacher(email, pw){
    const c = await signInWithEmailAndPassword(auth, email, pw);
    if (!(await verifyTeacher(c.user))) {
      await signOut(auth);                       // 교사가 아니면 익명으로 되돌린다
      _authReady = _bootGuarded();
      const e = new Error('교사 계정이 아닙니다'); e.code = 'app/not-teacher'; throw e;
    }
    _isTeacher = true;
    _authReady = Promise.resolve(c.user);
    return c.user;
  },

  /* 로그아웃 — 교사 세션을 끊고 다시 익명으로 돌아간다.
     학생 화면이 인증 없는 상태로 남으면 체크인이 규칙에 막힌다. */
  async leave(){
    _isTeacher = false;
    try { await signOut(auth); } catch(e){}
    _authReady = _bootGuarded();
    return _authReady;
  }
};

/* 방과후 체크인은 그날 18:30~24:00(한국시간)에만 가능하므로,
   특정 날짜의 기록은 그 구간의 타임스탬프 범위로 조회하면 된다.
   date 문자열 대신 서버 시각(at)을 기준으로 삼아야 위조가 불가능하다. */
/* PIN 해시 — salt로 학번을 쓴다(공개값이지만 학생마다 달라 무지개표를 막는다).
   앱 고유 문자열(pepper)도 섞는다. 저장된 해시 자체를 아무도 못 읽는 게
   핵심 방어이고, 이 해시 함수는 그 위에 얹는 층이다. */
async function _pinHash(sid, pin){
  const msg = 'topclass:v1:' + String(sid) + ':' + String(pin);
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* 한국시간 기준 오늘 날짜 — 모듈 안에서도 써야 해서 따로 둔다 */
function kstTodayISO(){
  const k = new Date(Date.now() + 9*60*60*1000);
  return k.toISOString().slice(0,10);
}

function kstRange(dateStr){
  const from = new Date(dateStr + 'T18:30:00+09:00');
  // 다음날 0시(KST)까지. 날짜 문자열을 다시 만들지 말고 24시간을 더한다 —
  // 예전엔 toISOString().slice(0,10)으로 날짜를 꺼냈는데, KST 자정 시각의
  // UTC 날짜는 '전날'이라 +1일이 상쇄돼 조회 범위가 뒤집혔다(항상 0건).
  const to   = new Date(new Date(dateStr + 'T00:00:00+09:00').getTime() + 24*60*60*1000);
  return { from, to };
}

  async examScores(){
    const snap = await getDocs(collection(db,'examScores'));
    const exams = {};
    snap.forEach(d => {
      const v = d.data();
      const key = String(v.examName||'')+'|'+String(v.examDate||'');
      if (!exams[key]) exams[key] = { name:String(v.examName||''), date:String(v.examDate||''),
                                      rows:[], avg:null, avgG:null };
      const e = exams[key];
      const sc = { name:String(v.studentName||''),
                   korean:Number(v.korean)||0, english:Number(v.english)||0,
                   history:Number(v.history)||0, total:Number(v.total)||0,
                   rank:Number(v.rank)||0 };
      if (sc.name === '__avg__')       e.avg  = sc;
      else if (sc.name === '__avgG__') e.avgG = sc;
      else                             e.rows.push(sc);
    });
    const list = Object.keys(exams).map(k => exams[k]);
    list.forEach(e => {
      // 점수 하나짜리 시험(NCS·모의고사)인지는 영어·한국사로 판단한다.

     계산할 수 있는 것은 원장에 쌓지 않는다 — 같은 사실을 두 군데 적으면
     반드시 어긋난다. 원장에는 교사 지급·차감처럼 계산 불가능한 것만 들어간다. */
  async openingOf(name){
    const s = await getDoc(doc(db,'opening',name));
    if (!s.exists()) return null;                 // 없으면 아직 전환 전 → 시트 값을 쓴다
    const v = s.data();
    return { date: String(v.date||''), coins: Number(v.coins)||0 };
  },
  async ledgerOf(name){
    const snap = await getDocs(query(collection(db,'ledger'), where('name','==',name)));
    const out = [];
    snap.forEach(d => { const v = d.data();
      out.push({ id:d.id, date:String(v.date||''), amount:Number(v.amount)||0,
                 reason:String(v.reason||''), by:String(v.by||'') }); });
    return out.sort((a,b)=> a.date < b.date ? 1 : -1);
  },
  async addLedger(name, amount, reason, by){
    await _authReady;
    await addDoc(collection(db,'ledger'),
      { name, amount: Number(amount), reason: String(reason),
        by: String(by), date: kstTodayISO(), at: serverTimestamp() });
  },

  /* ── 플래너 ────────────────────────────────────────
     날짜는 저장된 서버 시각(at)으로만 센다 — 학생이 날짜를 못 고른다.
     문서 ID에 날짜가 들어가지만 편의용 키일 뿐 판단 근거가 아니다. */
  async plannerOf(name){
    const snap = await getDocs(query(collection(db,'planner'), where('name','==',name)));
    const byDate = {};
    snap.forEach(d => {
      const v = d.data();
      if (!v.at || !v.at.seconds) return;
      const k = new Date(v.at.seconds*1000 + 9*60*60*1000).toISOString().slice(0,10);
      const prog = Number(v.progress)||0;
      if (!byDate[k] || prog > byDate[k].progress)
        byDate[k] = { id:d.id, progress:prog, tasks:String(v.tasks||'[]') };
    });
    return byDate;
  },
  async savePlanner(name, tasks, progress){
    await _authReady;
    const id  = (kstTodayISO()+'_'+name).replace(/[^\wㄱ-ㅎ가-힣-]/g,'_');
    const ref = doc(db,'planner',id);
    const cur = await getDoc(ref);
    const body = { tasks: JSON.stringify(tasks), progress: Number(progress)||0 };
    if (cur.exists()) await updateDoc(ref, body);
    else              await setDoc(ref, Object.assign({ name, at: serverTimestamp() }, body));
    return id;
  },

  async checkIns(dateStr){
    const { from, to } = kstRange(dateStr);
    const snap = await getDocs(query(collection(db,'asCheckIn'),
      where('at','>=',from), where('at','<',to)));
    const out = [];
    snap.forEach(d => out.push(d.data()));
    return out;
  },
  async checkIn(dateStr, subject, name, track){
    await _authReady;                 // 규칙이 로그인한 요청만 받는다
    const id = (dateStr+'_'+subject+'_'+name).replace(/[^\wㄱ-ㅎ가-힣-]/g,'_');
    await setDoc(doc(db,'asCheckIn',id),
      { at: serverTimestamp(), subject, name, track });
  }
};

/* ═══ 읽기 캐시 (먼저 보여주고 뒤에서 새로 고친다) ═══════════════
   폰에서는 서버 호출 한 번이 0.1~0.3초라, 탭을 옮길 때마다 다시 받으면 매번 기다리게 된다.
   - 받아 둔 값이 있으면 바로 돌려준다. FRESH_MS가 지났으면 뒤에서 새로 받아 두고,
     내용이 바뀌었으면 화면을 조용히 다시 그린다(window.softRefresh).
   - 같은 조회가 동시에 여러 번 불리면(집무실이 명부를 두 곳에서 부르는 식) 한 번만 보낸다.
   - 쓰기가 한 번이라도 일어나면 전부 비운다 — 방금 바꾼 게 옛 값으로 보이면 안 된다.
   - 로그인·로그아웃 때도 비운다(FS.__clear) — 사람이 바뀌면 볼 수 있는 자료가 다르다.
   ⚠️ 돌려주는 객체는 캐시와 같은 것이다. 받은 쪽에서 고치지 말 것. */
(function(){
  const READ = new Set(['schedule','memberById','attendanceOf','members','attendanceAll','freezeOf',
    'marketItems','marketBuys','examScores','amSince','calendarOff','counselAll','amCheckIns',
    'amOverrides','amCheckInsOf','amOverridesOf','openingOf','ledgerOf','plannerOf','checkIns']);
  const PASS = new Set(['myBinding']);          // 기기-학생 연결 확인은 매번 서버에 묻는다
  const FRESH_MS = 20000;
  const memo = new Map();                       // 키 → { v, t, p }
  let gen = 0, timer = null;
  const repaint = () => { clearTimeout(timer);
    timer = setTimeout(() => { if (typeof window.softRefresh === 'function') window.softRefresh(); }, 120); };

  function load(key, orig, self, args){
    const g = gen, e = memo.get(key) || {};
    e.p = orig.apply(self, args).then(v => {
      if (g !== gen) return v;                  // 그사이 쓰기가 있었다 — 이 응답은 담지 않는다
      const had = ('v' in e), before = had ? JSON.stringify(e.v) : '';
      memo.set(key, { v, t: Date.now(), p: null });
      if (had && before !== JSON.stringify(v)) repaint();
      return v;
    }, err => {
      const cur = memo.get(key);
      if (cur && 'v' in cur) cur.p = null; else memo.delete(key);
      throw err;
    });
    memo.set(key, e);
    return e.p;
  }

  for (const k of Object.keys(FS)) {
    const orig = FS[k];
    if (typeof orig !== 'function' || PASS.has(k)) continue;
    if (READ.has(k)) {
      FS[k] = function(...args){
        const key = k + JSON.stringify(args), e = memo.get(key);
        if (e && ('v' in e)) {
          if (Date.now() - e.t > FRESH_MS && !e.p) load(key, orig, this, args).catch(() => {});
          return Promise.resolve(e.v);
        }
        if (e && e.p) return e.p;
        return load(key, orig, this, args);
      };
    } else {
      // 목록에 없는 새 함수는 쓰기로 본다(안전한 쪽)
      FS[k] = async function(...args){
        try { return await orig.apply(this, args); } finally { gen++; memo.clear(); }
      };
    }
  }
  FS.__clear = () => { gen++; memo.clear(); };
  FS.__stale = () => { memo.forEach(e => { e.t = 0; }); };   // 앱이 다시 앞으로 나올 때
})();
window.dispatchEvent(new Event('fs-ready'));
</script>

/* ═══ 등교 출결 ═══════════════════════════════════════
   기존 GAS 정책을 그대로 옮긴 것 (code.gs checkIn 참조)
     06:00 이전   인증 불가
     08:30 이후   인증 불가 → 결석
     기숙사생     08:30 전이면 무조건 출석 (지각 없음)
     일반생       08:10 전 출석 / 08:10~08:29 지각
   상태는 학생이 고르지 않는다. 서버가 찍은 시각으로 계산하므로 위조 불가.
   결석은 저장하지 않는다 — 수업일인데 기록이 없으면 결석(방과후와 같은 규칙). */
var AM_OPEN_MIN  = 6*60;        // 06:00
var AM_LATE_MIN  = 8*60 + 10;   // 08:10 — 일반생 지각 기준
var AM_CLOSE_MIN = 8*60 + 30;   // 08:30 — 마감

/* ⚠️ v2가 출결의 원본이 되는 날. 전환 전까지는 학생이 구앱으로 인증하므로
   v2에 기록이 없는 게 당연하다 — 그걸 결석으로 세면 안 된다.
   학생을 v2로 옮기는 날 이 값을 그 날짜로 바꿀 것(§8 출시일 체크리스트). */
var ATT_V2_FROM = '2099-01-01';

var CAL = null;      // 나이스 학사일정 — v2/calendar.json
var CAL_OFF = {};    // 교사가 지정한 휴업일 — Firestore calendarOff

/** 학사일정을 읽는다. 실패해도 앱은 돌아가야 한다.
    나이스는 '학교가 등록한 휴업일'만 안다. 시험주간·꿈그린캠프처럼
    수업일이지만 아침자습을 안 한 날은 교사가 따로 지정한다(calendarOff). */
async function loadCalendar(force){
  if (CAL && !force) return CAL;
  // 학사일정 파일과 교사 지정 휴업일을 한꺼번에 받는다.
  // 여러 곳에서 동시에 불러도 한 번만 받도록 진행 중인 약속을 나눠 쓴다.
  if (!loadCalendar._p || force){
    loadCalendar._p = Promise.all([
      fetch('calendar.json', {cache:'no-cache'}).then(function(r){ return r.json(); })
        .then(null, function(){ return { 휴업일:{} }; }),
      soft(FS.calendarOff(), {})
    ]).then(function(r){ CAL = r[0]; CAL_OFF = r[1]; return CAL; });
    loadCalendar._p.then(function(){ loadCalendar._p = null; });
  }
  return loadCalendar._p;
}

/** 그 날이 수업일인가 — 주말·공휴일·재량휴업일·방학·교사지정 제외 */
function isSchoolDay(ds){
  if (isWeekend(ds)) return false;
  if (CAL_OFF[ds]) return false;
  return !(CAL && CAL.휴업일 && CAL.휴업일[ds]);
}
function offReason(ds){
  return CAL_OFF[ds] || (CAL && CAL.휴업일 && CAL.휴업일[ds]) || '';
}
/** 교사가 지정한 날인지(나이스 휴업일과 구분해서 표시·해제하려고) */
function isTeacherOff(ds){ return !!CAL_OFF[ds]; }

/** 서버가 찍은 시각 → 출석/지각. 기숙사생은 08:30 전이면 지각이 없다. */
function verdictFromAt(at, dorm){
  if (!at || !at.seconds) return '출석';
  var k = new Date(at.seconds*1000 + 9*3600*1000);     // KST 벽시계로 환산
  var m = k.getUTCHours()*60 + k.getUTCMinutes();
  if (dorm) return m < AM_CLOSE_MIN ? '출석' : '지각';
  return m < AM_LATE_MIN ? '출석' : '지각';
}

/** 하루치 출결 판정. 판정할 근거가 없으면 null(보류)을 준다.
    우선순위: 교사 정정 > v2 기록 > 구앱(시트) 이력 > 계산(결석) */
function attStatusOf(ds, ctx){
  // 교사가 직접 고친 것은 무엇보다 우선한다(휴업일이라도 존중)
  if (ctx.ov && ctx.ov[ds])     return ctx.ov[ds].status;

  // ⚠️ 휴업일이면 기록이 있어도 판정하지 않는다.
  //    구앱은 공휴일·재량휴업일에도 결석을 찍어놓은 날이 있다(예: 2026-07-17 제헌절).
  //    트리거가 학사일정을 모르고 돌았기 때문인데, 그대로 두면 쉬는 날에
  //    스트릭이 끊기고 엽전도 -2씩 깎인다. 나이스 학사일정이 있는 지금은
  //    달력을 기록보다 위에 둔다.
  if (!isSchoolDay(ds))         return null;

  if (ctx.am && ctx.am[ds])     return verdictFromAt(ctx.am[ds].at, ctx.dorm);
  var leg = ctx.days && ctx.days[ds];
  if (leg && leg.s)             return leg.s;
  if (ds === ctx.today)         return null;            // 오늘은 아직 인증 전일 수 있다
  // 기록이 없는 수업일 — 그 구간을 실제로 담당하는 소스가 있을 때만 결석으로 센다.
  // 구앱 이력이 끝난 뒤 v2 전환 전까지는 아무도 담당하지 않으므로 보류한다.
  if (ctx.legacyLast && ds <= ctx.legacyLast) return '결석';
  if (ds >= ATT_V2_FROM)                      return '결석';
  return null;
}

/** 오늘의 등교 인증 상태 — null이면 아직 안 읽음, {status,time} 또는 {status:null} */
var amToday = null;

  }

    var good = amToday.status === '출석';

      ';color:'+(good?'#16a34a':'var(--rose)')+';cursor:default">'+
      '<div style="text-align:left"><div class="checkin-t">'+amToday.status+' 처리되었습니다</div>'+

      '<div class="checkin-s">06:00부터 인증할 수 있어요</div></div>'+ic('clock',26)+'</div>';
  if (m >= AM_CLOSE_MIN)
    return '<div class="checkin" style="background:var(--rose-soft);color:var(--rose);cursor:default">'+
      '<div style="text-align:left"><div class="checkin-t">인증이 마감되었습니다</div>'+
      '<div class="checkin-s">08:30까지 인증하지 않아 결석 처리됩니다</div></div>'+ic('warn',26)+'</div>';

  var late = ME.dorm ? false : (m >= AM_LATE_MIN);
  return '<button class="checkin" onclick="doAmCheckIn()">'+
    '<div style="text-align:left"><div class="checkin-t">등교 인증하기</div>'+
    '<div class="checkin-s">'+(late? '지금 인증하면 지각입니다 (−1냥)'
                                   : (ME.dorm? '08:30까지 인증하면 출석 +1냥'
                                             : '08:10까지 인증하면 출석 +1냥'))+'</div></div>'+
    ic('check',26)+'</button>';
}

/** 오늘 내 등교 인증 기록을 읽어 amToday에 담는다 */
async function loadAmToday(){
  var today = kstToday();
  amToday = { status:null, time:'' };
  if (!ME.name) return amToday;
  try {
    var both = await Promise.all([ FS.amOverridesOf(ME.name), FS.amCheckInsOf(ME.name) ]);
    var ov = both[0], am = both[1];
    if (ov[today]){ amToday = { status: ov[today].status, time:'' }; return amToday; }
    if (am[today]){
      var at = am[today].at;
      var k  = new Date(at.seconds*1000 + 9*3600*1000);
      amToday = { status: verdictFromAt(at, am[today].dorm),
                  time: pad2(k.getUTCHours())+':'+pad2(k.getUTCMinutes()) };
    }
  } catch(e){ /* 조회 실패 시 버튼은 '인증하기'로 남는다 */ }
  return amToday;
}

/** 등교 인증 — 시각은 서버가 찍고, 상태는 그 시각으로 계산한다 */
async function doAmCheckIn(){
  if (!ME.name) return;
  var today = kstToday();
  try {
    await FS.amCheckIn(today, ME.name, ME.dorm);
    await loadAmToday();
    streakCache = null;
    ME.week = await buildWeek(ME.name);
    renderView();
    var ok = amToday.status === '출석';
    showModal('<div class="modal-box"><div style="text-align:center;padding:10px 0 6px">'+
      '<div style="font-size:2.4rem;line-height:1">'+(ok?'✅':'⏰')+'</div>'+
      '<div style="font-size:1.35rem;font-weight:800;margin-top:10px">'+amToday.status+' 처리되었습니다</div>'+
      '<div style="font-size:.85rem;color:var(--ink-mute);margin-top:6px">'+amToday.time+'에 인증했어요</div>'+
      '</div><button class="btn" onclick="closeModal()">확인</button></div>');
  } catch(e){
    var msg = (e && e.code === 'permission-denied')
      ? '인증 가능 시간이 아닙니다 (06:00~08:30)'
      : '인증에 실패했습니다. 잠시 후 다시 해주세요';
    showModal('<div class="modal-box"><div style="text-align:center;padding:10px 0 6px">'+
      '<div style="font-size:2.4rem;line-height:1">⚠️</div>'+
      '<div style="font-size:1.35rem;font-weight:800;margin-top:10px">인증 실패</div>'+
      '<div style="font-size:.85rem;color:var(--ink-mute);margin-top:6px">'+msg+'</div>'+
      '</div><button class="btn" onclick="closeModal()">확인</button></div>');
  }
}

/* ═══ 엽전 계산 ═══════════════════════════════════════
   잔액 = 개시잔액 + 원장 합계 + 출결 계산분

   출결로 생기는 엽전(출석 +1 / 지각 −1 / 결석 −2 / 주간개근 +5)은
   기록에서 계산한다. 원장에 따로 쌓지 않는 이유: 같은 사실을 두 군데
   적으면 언젠가 반드시 어긋나고, 어느 쪽이 맞는지 알 수 없게 된다.
   출결을 고치면(amOverride) 엽전도 자동으로 따라 바뀐다 — 구앱에서
   '출결정정: 결석→출석' 같은 보정 기록을 따로 넣던 일이 없어진다.

   ⚠️ 개시잔액(opening)이 없으면 아직 전환 전이다. 이때는 계산하지 않고
      시트에서 온 members.coins를 그대로 쓴다 — 전환 전까지 아무것도
      달라지지 않게 하려는 것. 전환일에 opening 문서를 만들면 자동으로
      계산 방식으로 넘어간다. */
var COIN_RULE = { 출석:+1, 지각:-1, 결석:-2, 공결:0, 주간개근:+5,
                  플래너100:+2, 플래너미작성:-1 };

/** 두 날짜 사이의 평일을 훑는다(양끝 포함) */
function eachWeekday(fromDs, toDs, fn){
  // UTC 정오를 기준점으로 하루씩 더한다 — 기기 시간대·서머타임에 흔들리지 않는다
  var cur = new Date(fromDs + 'T12:00:00Z');
  var end = new Date(toDs   + 'T12:00:00Z');
  for (var i=0; i<500 && cur <= end; i++){
    var ds = cur.toISOString().slice(0,10);
    if (!isWeekend(ds)) fn(ds);
    cur = new Date(cur.getTime() + 24*60*60*1000);
  }
}

/** 출결에서 생긴 엽전 — 개시일 다음날부터 오늘까지 */
function coinFromAttendance(fromDs, toDs, ctx){
  var total = 0, items = [];
  var weekBuf = [];      // 한 주(월~금)의 수업일 판정을 모아 개근을 본다

  var flushWeek = function(){
    if (weekBuf.length && weekBuf.every(function(x){ return x.st === '출석'; })){
      total += COIN_RULE.주간개근;
      items.push({ date: weekBuf[weekBuf.length-1].ds, amount: COIN_RULE.주간개근,
                   reason: '주간개근', by: '계산' });
    }
    weekBuf = [];
  };

  eachWeekday(fromDs, toDs, function(ds){
    if (dowOf(ds) === 1) flushWeek();            // 월요일이면 지난 주를 마감
    if (!isSchoolDay(ds)) return;               // 휴업일은 개근 판정에서도 빠진다

    var st = attStatusOf(ds, ctx);
    if (st === null) return;                    // 판정 보류(오늘·데이터 공백)

    var amt = COIN_RULE[st];
    if (amt) {
      total += amt;
      items.push({ date: ds, amount: amt, reason: st, by: '계산' });
    }
    weekBuf.push({ ds: ds, st: st });
  });
  // 마지막 주는 그 주가 끝났을 때만 개근을 센다(진행 중인 주는 아직 모른다)
  var lastMonday = (function(){
    var k = kstNow();
    var d = new Date(k.getFullYear(), k.getMonth(), k.getDate() - ((k.getDay()+6)%7));
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  })();
  if (weekBuf.length && weekBuf[0].ds < lastMonday) flushWeek();

  return { total: total, items: items };
}

/** 플래너에서 생긴 엽전 — 100% +2 / 미작성 −1.
    ⚠️ 결석한 날은 미작성 감점을 하지 않는다(구앱과 동일 — 중복 차감 방지).
       code.gs dailyPlannerPenalty: absentSet에 있으면 건너뜀. */
function coinFromPlanner(fromDs, toDs, plannerByDate, ctx){
  var total = 0, items = [];
  eachWeekday(fromDs, toDs, function(ds){
    if (!isSchoolDay(ds)) return;
    if (ds === ctx.today) return;              // 오늘은 아직 쓸 시간이 남았다

    var st = attStatusOf(ds, ctx);
    if (st === null) return;                   // 출결 판정 보류 구간은 플래너도 보류
    if (st === '결석') return;                 // 결석자는 미작성 감점 제외

    var pl = plannerByDate[ds];
    if (!pl){
      total += COIN_RULE.플래너미작성;
      items.push({ date: ds, amount: COIN_RULE.플래너미작성, reason: '플래너미작성', by: '계산' });
    } else if (pl.progress === 100){
      total += COIN_RULE.플래너100;
      items.push({ date: ds, amount: COIN_RULE.플래너100, reason: '플래너100%달성', by: '계산' });
    }
  });
  return { total: total, items: items };
}

/** 실패해도 되는 조회는 기본값으로 — Promise.all 안에서 하나가 실패해도 나머지를 쓰게 */
function soft(p, d){ return p.then(null, function(){ return d; }); }

/** 한 학생의 엽전 잔액과 내역.
    반환 mode: '계산' = v2가 계산한 값 / '시트' = 아직 전환 전이라 GAS 값 */
async function loadWallet(m){
  await loadCalendar();
  var name = m.name;
  var open = await FS.openingOf(name);

  if (!open){
    return { mode:'시트', balance: m.coins, items: [], opening: null };
  }

  // 재료 7가지를 한꺼번에 받는다. 차례로 기다리면 폰에서는 호출 수 × 왕복 시간만큼
  // 늦어진다(교사 엽전 화면은 이걸 학생 수만큼 부른다). 실패해도 되는 것은 기본값으로.
  var got = await Promise.all([
    FS.ledgerOf(name), FS.attendanceOf(name),
    soft(FS.amCheckInsOf(name), {}), soft(FS.amOverridesOf(name), {}),
    soft(FS.marketBuys(), []), soft(FS.freezeOf(name), { bought:0 }),
    soft(FS.plannerOf(name), {})
  ]);
  var ledger = got[0];
  var ledgerSum = ledger.reduce(function(a,b){ return a + b.amount; }, 0);

  // 출결 판정에 필요한 재료
  var days = got[1];
  var legacyLast = Object.keys(days).sort().pop() || '';
  var today = kstToday();
  // 이름으로 한 번씩만 읽는다. 날짜별 전체 조회는 (1) 규칙상 학생이 못 읽고
  // (2) 개시일 이후 날짜 수만큼 쿼리가 늘어 느리다.
  var am = got[2], ov = got[3];
  var ctx = { days:days, legacyLast:legacyLast, today:today,
              dorm:!!m.dorm, am:am, ov:ov };

  // 개시일 다음날부터 센다 — 개시잔액에 그날까지가 이미 반영돼 있다
  var from = new Date(new Date(open.date+'T12:00:00Z').getTime() + 24*60*60*1000)
              .toISOString().slice(0,10);
  var att = coinFromAttendance(from, today, ctx);

  // 저잣거리 구매 — 판매 기록에서 계산한다(원장에 따로 적지 않는다)
  var marketCost = 0, marketItems2 = [];
  try {
    var buys = got[4];
    buys.filter(function(b){ return b.student === name; }).forEach(function(b){
      var c = b.qty * b.price;
      marketCost -= c;
      marketItems2.push({ date: new Date(b.at*1000 + 9*3600*1000).toISOString().slice(0,10),
                          amount: -c, reason: '저잣거리: '+b.item+' ×'+b.qty, by: '계산' });
    });
  } catch(e){}

  // 프리즈 구매 비용 — 구매 기록 수로 계산한다(원장에 따로 적지 않는다)
  var fz = got[5] || { bought:0 };
  var freezeCost = -FREEZE_COST * (fz.bought || 0);
  var freezeItems = [];
  for (var fi=0; fi<(fz.bought||0); fi++)
    freezeItems.push({ date:'', amount:-FREEZE_COST, reason:'스트릭 프리즈 구매', by:'계산' });

  var plannerByDate = got[6] || {};
  var pl = coinFromPlanner(from, today, plannerByDate, ctx);

  var items = att.items.concat(pl.items).concat(freezeItems).concat(marketItems2)
              .concat(ledger.map(function(l){
    return { date:l.date, amount:l.amount, reason:l.reason, by:l.by||'교사' };
  })).sort(function(a,b){ return a.date < b.date ? 1 : -1; });

  return { mode:'계산',
           balance: open.coins + ledgerSum + att.total + pl.total + freezeCost + marketCost,
           items: items, opening: open };
}

/* ═══ 플래너 ═══════════════════════════════════════════
   구앱과 같은 형식으로 저장한다: [{text, status}] (0 미정 / 1 못함 / 2 진행중 / 3 완료)
   진도 = 완료(3) 개수 / 전체 × 100. 100%면 +2냥, 수업일에 안 쓰면 −1냥.
   ⚠️ 둘 다 계산으로 처리하므로 엽전을 따로 기록하지 않는다. */
var PLAN_ICON = ['⬜','❌','🔄','✅'];
var PLAN_LBL  = ['미정','못함','진행중','완료'];
var planTasks = [];

function planProgress(tasks){
  if (!tasks.length) return 0;
  var done = tasks.filter(function(t){ return t.status === 3; }).length;
  return Math.round(done / tasks.length * 100);
}

/** 홈 카드에 쓸 오늘 플래너 진도. 기록이 없으면 null(화면에 '–') */
async function loadPlannerToday(){
  ME.planner = null;
  if (!ME.name) return;
  try {
    var byDate = await FS.plannerOf(ME.name);
    var t = byDate[kstToday()];
    if (!t) return;
    var tasks = JSON.parse(t.tasks || '[]');
    if (!Array.isArray(tasks) || !tasks.length) return;
    ME.planner = { done: tasks.filter(function(x){ return x.status === 3; }).length,
                   total: tasks.length };
  } catch(e){}
}

async function openPlanner(){
  if (!ME.name) return;
  var today = kstToday();
  var byDate = {};
  try { byDate = await FS.plannerOf(ME.name); } catch(e){}
  try { planTasks = JSON.parse((byDate[today]||{}).tasks || '[]'); } catch(e){ planTasks = []; }
  if (!Array.isArray(planTasks)) planTasks = [];
  drawPlanner();
}

function drawPlanner(){
  var pct = planProgress(planTasks);
  var html = '<div class="modal-box">'+
    '<div style="text-align:center;padding:4px 0 12px">'+
      '<div style="font-size:1.25rem;font-weight:800">오늘의 플래너</div>'+
      '<div style="font-size:.82rem;color:var(--ink-mute);margin-top:4px">'+
        (planTasks.length? pct+'% · 100%면 +2냥' : '할 일을 적으면 시작돼요')+'</div>'+
    '</div>'+
    '<div class="bar" style="margin-bottom:12px"><i class="'+(pct===100?'g':'')+
      '" style="width:'+pct+'%"></i></div>';

  html += planTasks.map(function(t,i){
    return '<div class="row" style="cursor:pointer" onclick="cyclePlan('+i+')">'+
      '<div style="font-size:1.15rem;width:26px;text-align:center">'+PLAN_ICON[t.status||0]+'</div>'+
      '<div class="row-main"><div class="row-t" style="'+(t.status===3?'color:var(--ink-mute)':'')+'">'+
        escapeHtml(t.text)+'</div>'+
      '<div class="row-s">'+PLAN_LBL[t.status||0]+'</div></div>'+
      '<span onclick="event.stopPropagation();removePlan('+i+')" '+
        'style="color:var(--ink-mute);padding:6px 8px">✕</span></div>';
  }).join('');

  html += '<div class="field" style="margin-top:10px">'+
    '<input id="planNew" type="text" placeholder="할 일 추가 (예: 한국사 숙제)" '+
      'onkeydown="if(event.key===\'Enter\')addPlan()"></div>'+
    '<button class="btn btn-outline" onclick="addPlan()">추가</button>'+
    '<div id="planErr" class="login-err hidden"></div>'+
    '<button class="btn" id="planSave" onclick="savePlannerNow()">저장</button>'+
    '<button class="btn btn-outline" onclick="closeModal()">닫기</button></div>';
  showModal(html);
}

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function addPlan(){
  var el = document.getElementById('planNew');
  var t = (el.value||'').trim();
  if (!t) return;
  planTasks.push({ text:t, status:0 });
  drawPlanner();
}
function removePlan(i){ planTasks.splice(i,1); drawPlanner(); }
function cyclePlan(i){
  planTasks[i].status = ((planTasks[i].status||0) + 1) % 4;   // 미정→못함→진행중→완료
  drawPlanner();
}

async function savePlannerNow(){
  var btn = document.getElementById('planSave');
  var err = document.getElementById('planErr');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    await FS.savePlanner(ME.name, planTasks, planProgress(planTasks));
    ME.planner = { done: planTasks.filter(function(t){return t.status===3;}).length,
                   total: planTasks.length };
    closeModal(); renderView();
  } catch(e){
    btn.disabled = false; btn.textContent = '저장';
    err.textContent = (e && e.code === 'permission-denied')
      ? '오늘 플래너만 수정할 수 있습니다' : '저장하지 못했습니다';
    err.classList.remove('hidden');
  }
}

/* ═══ 상담 ═══════════════════════════════════════════
   ⚠️ 학생 개인정보라 교사 전용이다(보안규칙에서도 교사만 읽힌다).
   구앱과 같은 규칙: 메모를 쓰면 곧 상담완료 — 별도 체크 없음. */
var counselCache = null;

async function renderCounsel(v){
  v.innerHTML='<div class="empty"><span>불러오는 중…</span></div>';
  var mem, recs;
  try {
    mem  = await FS.members();
    recs = await FS.counselAll();
  } catch(e){
    v.innerHTML='<div class="empty"><div class="empty-ico">'+ic('chat',44)+'</div>'+
      '<span>교사로 로그인해야 볼 수 있습니다</span></div>';
    fillIcoSlots(v); return;
  }
  counselCache = recs;

  // 학생별 최근 상담일
  var last = {};
  recs.forEach(function(r){ if (!last[r.name]) last[r.name] = r; });

  var html = '<div class="sec-label">학생별 상담</div><div class="card">';
  html += mem.map(function(m){
    var r = last[m.name];
    var days = r ? Math.floor((new Date(kstToday()) - new Date(r.date)) / 86400000) : null;
    var warn = (days === null || days > 30);
    return '<div class="row" onclick="openCounsel(\''+escapeHtml(m.name)+'\')" style="cursor:pointer">'+
      '<div class="avatar">'+m.name.charAt(0)+'</div>'+
      '<div class="row-main"><div class="row-t">'+escapeHtml(m.name)+'</div>'+
      '<div class="row-s" style="'+(warn?'color:var(--rose)':'')+'">'+
        (r ? r.date+' · '+days+'일 전' : '상담 기록 없음')+'</div></div>'+
      (r ? '<span class="chip" style="background:var(--green-soft);color:#16a34a">완료</span>' : '')+
      '</div>';
  }).join('') + '</div>';

  if (recs.length){
    html += '<div class="sec-label">최근 기록</div><div class="card">';
    html += recs.slice(0,15).map(function(r){
      return '<div class="row" onclick="openCounsel(\''+escapeHtml(r.name)+'\')" style="cursor:pointer">'+
        '<div class="row-main"><div class="row-t">'+escapeHtml(r.name)+
          ' <span style="font-weight:500;color:var(--ink-mute)">'+r.date+'</span></div>'+
        '<div class="row-s">'+escapeHtml(r.memo).slice(0,60)+(r.memo.length>60?'…':'')+'</div></div></div>';
    }).join('') + '</div>';
  }
  v.innerHTML = html; fillIcoSlots(v);
}

function openCounsel(name){
  var mine = (counselCache||[]).filter(function(r){ return r.name === name; });
  var today = kstToday();
  var todayRec = mine.filter(function(r){ return r.date === today; })[0];

  var html = '<div class="modal-box">'+
    '<div style="text-align:center;padding:4px 0 14px">'+
      '<div style="font-size:1.25rem;font-weight:800">'+escapeHtml(name)+'</div>'+
      '<div style="font-size:.82rem;color:var(--ink-mute);margin-top:4px">'+today+' 상담</div></div>'+
    '<div class="field"><label>상담 내용</label>'+
      '<textarea id="cMemo" rows="5" placeholder="상담 내용을 적으면 상담완료로 기록됩니다" '+
      'style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;'+
      'font-family:inherit;font-size:.92rem;resize:vertical">'+
      escapeHtml(todayRec ? todayRec.memo : '')+'</textarea></div>'+
    '<div id="cErr" class="login-err hidden"></div>'+
    '<button class="btn" id="cGo" onclick="applyCounsel(\''+escapeHtml(name)+'\')">저장</button>'+
    '<button class="btn btn-outline" onclick="closeModal()">닫기</button>';

  var past = mine.filter(function(r){ return r.date !== today; });
  if (past.length){
    html += '<div class="sec-label">지난 상담</div><div class="card">';
    html += past.slice(0,8).map(function(r){
      return '<div class="row" style="cursor:default"><div class="row-main">'+
        '<div class="row-t">'+r.date+'</div>'+
        '<div class="row-s">'+escapeHtml(r.memo)+'</div></div></div>';
    }).join('') + '</div>';
  }
  html += '</div>';
  showModal(html);
}

async function applyCounsel(name){
  var memo = (document.getElementById('cMemo').value||'').trim();
  var err  = document.getElementById('cErr');
  if (!memo){ err.textContent='상담 내용을 입력해주세요'; err.classList.remove('hidden'); return; }
  var btn = document.getElementById('cGo'); btn.disabled=true; btn.textContent='저장 중...';
  try { await FS.saveCounsel(kstToday(), name, memo); closeModal(); renderView(); }
  catch(e){ btn.disabled=false; btn.textContent='저장';
    err.textContent = (e && e.code==='permission-denied')
      ? '교사로 로그인해야 합니다' : '저장하지 못했습니다';
    err.classList.remove('hidden'); }
}

/* ═══ 성적 ═══════════════════════════════════════════
   시험 두 종류를 다르게 그린다.
     NCS·모의고사   → 점수 하나
     지역인재 기출  → 국어·영어·한국사 + 총점
   비교 기준은 공기업 학생이면 __avgG__(공기업 평균), 없으면 __avg__(전체). */
var examCache = null;

function examAvgFor(e, track){
  if (track === '공기업' && e.avgG) return e.avgG;
  return e.avg || e.avgG || null;
}
function diffChip(mine, avg){
  if (!avg) return '';
  var d = Math.round((mine - avg) * 10) / 10;
  if (!d) return '<span class="row-s" style="color:var(--ink-mute)">평균과 같음</span>';
  var up = d > 0;
  return '<span class="row-s" style="color:'+(up?'var(--green)':'var(--rose)')+'">'+
    '평균 '+(up?'+':'')+d+'</span>';
}

        '<div class="row-v" style="font-size:1.5rem;font-weight:800">'+r.korean+'<small>점</small></div>'+
      '</div></div>';

        html += '<div class="row" style="cursor:default"><div class="row-main">'+

/* ═══ 저잣거리 ═══════════════════════════════════════
   재고를 문서에 들고 있지 않는다: 재고 = stock(시작 수량) − 판매 합계.
   문서를 고치는 게 아니라 기록을 쌓기만 하므로 동시 판매에도 꼬이지 않고,
   "재고는 줄었는데 엽전은 안 빠졌다"가 구조적으로 생기지 않는다.
   구앱과 마찬가지로 판매는 교사가 처리한다(물건을 건네주는 사람이 교사라서). */
var marketCache = null;

async function loadMarket(force){
  if (marketCache && !force) return marketCache;
  var items = await FS.marketItems();
  var buys  = await FS.marketBuys();
  var sold  = {};
  buys.forEach(function(b){ sold[b.item] = (sold[b.item]||0) + b.qty; });
  items.forEach(function(it){ it.left = Math.max(0, it.stock - (sold[it.name]||0)); });
  marketCache = { items: items, buys: buys };
  return marketCache;
}

async function renderMarket(v){
  v.innerHTML='<div class="empty"><span>불러오는 중…</span></div>';
  var m = await loadMarket(true);
  var teacher = (ROLE === 'teacher');

  if (!m.items.length){
    v.innerHTML = '<div class="empty"><div class="empty-ico">'+ic('market',44)+'</div>'+
      '<span>아직 등록된 물품이 없어요'+(teacher?'<br>아래에서 물품을 추가해주세요':'')+'</span></div>'+
      (teacher? '<button class="btn" onclick="seedMarket()">기본 물품 한번에 등록</button>'+
                '<button class="btn btn-outline" onclick="openAddItem()">물품 직접 추가</button>' : '');
    fillIcoSlots(v); return;
  }

  var html = '';
  if (!teacher)
    html += '<div class="hero"><div class="hero-lbl">내 엽전</div>'+
      '<div class="hero-num" style="color:'+(ME.coins<0?'var(--rose)':'var(--ink)')+'">'+
      ME.coins+'<small>냥</small></div></div>';

  html += '<div class="sec-label">물품</div><div class="card">';
  html += m.items.map(function(it){
    var out = it.left <= 0;
    var afford = teacher || (ME.coins >= it.price);
    return '<div class="row"'+(teacher? ' onclick="openSell(\''+it.id+'\')" style="cursor:pointer"':' style="cursor:default"')+'>'+
      '<div class="row-main"><div class="row-t" style="'+(out?'color:var(--ink-mute)':'')+'">'+
        escapeHtml(it.name)+'</div>'+
      '<div class="row-s">'+(out? '품절'
        : '남은 수량 '+it.left+'개'+(!afford?' · 엽전 부족':''))+'</div></div>'+
      '<span class="chip" style="background:'+(out?'var(--line-soft)':'var(--accent-soft,#eef0ff)')+
        ';color:'+(out?'var(--ink-mute)':'var(--accent)')+'">'+it.price+'냥</span></div>';
  }).join('') + '</div>';

  if (teacher){
    html += '<div class="sec-label" style="color:var(--ink-mute);font-weight:500">'+
      '물품을 탭하면 학생에게 판매할 수 있습니다</div>'+
      '<button class="btn btn-outline" onclick="openAddItem()">물품 추가</button>';
    if (m.buys.length){
      html += '<div class="sec-label">최근 판매</div><div class="card">';
      html += m.buys.slice(0,10).map(function(b){
        return '<div class="row" style="cursor:default">'+
          '<div class="row-main"><div class="row-t">'+escapeHtml(b.student)+'</div>'+
          '<div class="row-s">'+escapeHtml(b.item)+' ×'+b.qty+'</div></div>'+
          '<span class="row-v" style="color:var(--rose)">-'+(b.qty*b.price)+'냥</span>'+
          '<span onclick="cancelSell(\''+b.id+'\')" style="color:var(--ink-mute);padding:6px 8px">✕</span>'+
          '</div>';
      }).join('') + '</div>';
    }
  } else {
    html += '<div class="sec-label" style="color:var(--ink-mute);font-weight:500">'+
      '구매는 선생님께 말씀드리면 처리해주십니다</div>';
  }
  v.innerHTML = html; fillIcoSlots(v);
}

  var who=document.getElementById('sellWho').value;

var amDate = null;                 // 교사가 보고 있는 날짜

function amColor(st){

       : st==='지각' ? ['#fef3c7','#b45309']
       : st==='결석' ? ['var(--rose-soft)','var(--rose)']
       : st==='공결' ? ['var(--line-soft)','var(--ink-soft)']

}

/* ═══ 로컬 알림 ═══════════════════════════════════════
   v2는 서버가 없어 푸시를 못 보낸다. 대신 기기에 미리 예약해두는
   로컬 알림을 쓴다(상담일지 앱과 같은 방식).

   ⚠️ 설치된 앱(Capacitor)에서만 동작한다. 웹에서는 조용히 넘어간다.
   ⚠️ 번들러가 없으므로 import가 아니라 네이티브 브리지가 붙여주는
      window.Capacitor.Plugins 로 접근한다.

   요일 반복(repeats)이 아니라 '날짜 지정'으로 예약한다. 공휴일·재량휴업일·
   시험주간에 알림이 울리면 안 되는데 반복 예약은 달력을 모르기 때문이다.
   앱을 열 때마다 앞으로 3주치를 다시 깐다(iOS 대기 알림 상한 64개). */
var NOTI_KEY        = 'tc_noti';
var NOTI_AM_HOUR    = 7, NOTI_AM_MIN = 50;   // 등교 인증(08:10 마감 전)
var NOTI_DAYS_AHEAD = 21;
var NOTI_ID_BASE    = 71000;
var NOTI_ID_MAX     = 60;

function isNativeApp(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform
            && window.Capacitor.isNativePlatform());
}
function capLN(){
  return (window.Capacitor && window.Capacitor.Plugins
          && window.Capacitor.Plugins.LocalNotifications) || null;
}
function notiOn(){
  try { return localStorage.getItem(NOTI_KEY) === '1'; } catch(e){ return false; }
}
function setNotiOn(v){
  try { localStorage.setItem(NOTI_KEY, v ? '1' : '0'); } catch(e){}
}
/** 학생 홈의 알림 줄 — 켜져 있으면 상태를, 아니면 켜기를 권한다 */
function notiBanner(){
  if (notiOn())
    return '<div class="notice" style="background:var(--green-soft);color:#16a34a;cursor:pointer" '+
      'onclick="toggleNotis()">'+ic('bell',15)+
      '<span>알림 켜짐 · 아침 '+pad2(NOTI_AM_HOUR)+':'+pad2(NOTI_AM_MIN)+
      ', 방과후 18:30 (탭하면 끄기)</span></div>';
  return '<div class="notice" style="cursor:pointer" onclick="toggleNotis()">'+ic('bell',15)+
    '<span>알림 켜고 등교·방과후 소식 받기 →</span></div>';
}

function notiIds(){
  var a=[]; for (var i=0;i<NOTI_ID_MAX;i++) a.push({ id: NOTI_ID_BASE + i }); return a;
}

/** 앞으로 3주치 알림을 다시 깐다. 켜져 있고 설치된 앱일 때만. */
async function scheduleLocalNotis(){
  var LN = capLN();
  if (!LN || !isNativeApp() || !notiOn() || !ME.name) return 'skip';
  try { await LN.cancel({ notifications: notiIds() }); } catch(e){}   // 우리 것만 지운다

  await loadCalendar(true);
  var sched = { weekly:[], exceptions:[] };
  try { sched = await FS.schedule(); } catch(e){}

  var list = [], n = 0, today = kstToday();
  for (var d = 1; d <= NOTI_DAYS_AHEAD && n < NOTI_ID_MAX - 1; d++){
    var ds = shiftDay(today, d);
    if (!isSchoolDay(ds)) continue;            // 주말·공휴일·휴업일·자습없는날 제외

    list.push({
      id: NOTI_ID_BASE + (n++),
      title: '등교 인증하세요',
      body: '08:10까지 인증하면 출석 +1냥이에요.',
      schedule: { at: new Date(ds+'T'+pad2(NOTI_AM_HOUR)+':'+pad2(NOTI_AM_MIN)+':00+09:00'),
                  allowWhileIdle: true }
    });

    var mine = classesOn(sched, ds).filter(function(c){
      var t = classTrack(c); return t === '공통' || t === ME.track;
    });
    if (mine.length && n < NOTI_ID_MAX){
      list.push({
        id: NOTI_ID_BASE + (n++),
        title: '방과후 출석체크',
        body: mine[0].subject + ' 시작 — 자정까지 체크하지 않으면 결석이에요.',
        schedule: { at: new Date(ds+'T18:30:00+09:00'), allowWhileIdle: true }
      });
    }
  }
  if (!list.length) return 'none';
  try { await LN.schedule({ notifications: list }); return 'ok:' + list.length; }
  catch(e){ return 'error:' + ((e && e.message) || e); }
}

function notiModal(emoji, title, body){
  showModal('<div class="modal-box"><div style="text-align:center;padding:12px 0">'+
    '<div style="font-size:2.2rem">'+emoji+'</div>'+
    '<div style="font-size:1.15rem;font-weight:800;margin-top:10px">'+title+'</div>'+
    '<div style="font-size:.85rem;color:var(--ink-mute);margin-top:8px;line-height:1.5">'+body+'</div>'+
    '</div><button class="btn" onclick="closeModal()">확인</button></div>');
}

/** 알림 켜기 — 권한부터 묻는다 */
async function enableNotis(){
  var LN = capLN();
  if (!LN || !isNativeApp()){
    notiModal('📱','앱에서만 됩니다',
      '알림은 홈 화면에 설치한 앱에서만 받을 수 있어요.<br>브라우저로 열었을 때는 동작하지 않습니다.');
    return;
  }
  try {
    var p = await LN.checkPermissions();
    if (p.display !== 'granted') p = await LN.requestPermissions();
    if (p.display !== 'granted'){
      notiModal('🔕','알림이 꺼져 있어요','설정 → 알림에서 이 앱의 알림을 켜주세요.');
      return;
    }
    setNotiOn(true);
    await scheduleLocalNotis();
    renderView();
    notiModal('🔔','알림을 켰어요',
      '수업일 아침 '+pad2(NOTI_AM_HOUR)+':'+pad2(NOTI_AM_MIN)+'에 등교 인증을,<br>'+
      '방과후 수업이 있는 날 18:30에 출석체크를 알려드려요.<br>'+
      '<span style="color:var(--ink-mute)">쉬는 날에는 울리지 않습니다.</span>');
  } catch(e){
    notiModal('⚠️','알림을 켜지 못했어요','잠시 후 다시 시도해주세요.');
  }
}

async function disableNotis(){
  var LN = capLN();
  setNotiOn(false);
  if (LN){ try { await LN.cancel({ notifications: notiIds() }); } catch(e){} }
  renderView();
}
function toggleNotis(){ notiOn() ? disableNotis() : enableNotis(); }

/* ── 자습 없는 날 자동 감지 ──────────────────────────
   나이스는 시험주간·캠프를 모른다. 그런 날 교사가 표시를 안 하면 전원이
   결석 처리되고 엽전이 깎인다(실제로 2026-06-29·07-06·07-09에 그랬다).
   서버가 없어 푸시는 못 보내지만, 교사가 앱을 열 때 짚어주면 그 자리에서
   바로 처리할 수 있다. */
var QUIET_RATIO = 0.7;      // 명부의 70% 이상 결석이면 물어본다
var QUIET_LOOKBACK = 21;    // 최근 3주
var QKEY = 'tc_quiet_ok';   // "수업일 맞다"고 넘긴 날 (이 기기에서만 기억)

function quietDismissed(){
  try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(e){ return []; }
}
function dismissQuiet(ds){
  try {
    var a = quietDismissed(); if (a.indexOf(ds) < 0) a.push(ds);
    localStorage.setItem(QKEY, JSON.stringify(a.slice(-60)));
  } catch(e){}
}

/** 최근 수업일 중 '대부분 결석'인 날을 찾는다 */
async function scanQuietDays(){
  await loadCalendar();
  var today = kstToday();
  var from  = shiftDay(today, -QUIET_LOOKBACK);
  var got = await Promise.all([ FS.members(), FS.attendanceAll(),
                                soft(FS.amSince(from), { am:{}, ov:{} }) ]);
  var mem = got[0];
  if (!mem.length) return [];

  var att = got[1];
  var legacyLast = '';
  for (var nm in att.byName){
    var ks = Object.keys(att.byName[nm]).sort();
    if (ks.length && ks[ks.length-1] > legacyLast) legacyLast = ks[ks.length-1];
  }
  var recent = got[2];

  var skip = quietDismissed(), out = [];
  eachWeekday(from, today, function(ds){
    if (ds === today) return;                 // 오늘은 아직 진행 중
    if (!isSchoolDay(ds)) return;             // 이미 휴업일로 알고 있는 날
    if (skip.indexOf(ds) >= 0) return;        // 교사가 "수업일 맞다"고 넘긴 날

    var absent = 0;
    mem.forEach(function(m){
      var ctx = { days: att.byName[m.name] || {}, legacyLast: legacyLast, today: today,
                  dorm: m.dorm,
                  am: (recent.am[ds] && recent.am[ds][m.name]) ? _one(ds, recent.am[ds][m.name]) : {},
                  ov: (recent.ov[ds] && recent.ov[ds][m.name]) ? _one(ds, recent.ov[ds][m.name]) : {} };
      if (attStatusOf(ds, ctx) === '결석') absent++;
    });
    if (absent >= Math.ceil(mem.length * QUIET_RATIO))
      out.push({ date: ds, absent: absent, total: mem.length });
  });
  return out.sort(function(a,b){ return b.date.localeCompare(a.date); });
}
function _one(ds, v){ var o = {}; o[ds] = v; return o; }

/* ═══ 연속출석 스트릭 ═══════════════════════════════════
   판정 규칙 (2026-09-01 확정)
     출석 → +1 (스트릭이 늘어나는 유일한 경우)
     지각 → 유지되되 늘지 않음   ← 이 반은 결석보다 지각이 압도적이라 핵심
     공결 → 유지, 늘지 않음
     결석 → 끊김 (단, 그 날짜를 프리즈로 메웠으면 유지)
     주말 / 수업일 아닌 날(전교생 기록 없음) → 건너뜀
     오늘 아직 미인증 → 판정 보류(관용)
   프리즈: 저잣거리에서 엽전 10냥에 구매, 끊긴 날에 사용해 되살림 */
var MILESTONES = [3, 7, 30, 100];
var FREEZE_COST = 10;
var streakCache = null;   // { streak, longest, atRisk, brokenAt, freezes, member }

function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
/** 날짜 문자열의 요일 (0=일 ~ 6=토).
    ⚠️ new Date(ds+'T00:00:00+09:00')에 getDay()를 쓰면 기기 시간대에 따라
       하루가 밀린다(UTC 기기에서 월요일이 일요일로 나옴). UTC 정오를 기준점으로
       삼으면 어느 시간대에서도 같은 날짜가 나온다. */
function dowOf(ds){ return new Date(ds+'T12:00:00Z').getUTCDay(); }
function isWeekend(ds){ var w = dowOf(ds); return w===0||w===6; }

/** 하루의 판정: 'up'(증가) | 'keep'(유지) | 'skip'(무관) | 'break'(끊김)
    출결 판정은 attStatusOf에 맡긴다 — 교사정정 > v2기록 > 구앱이력 > 계산.
    덕분에 교사가 출결을 고치면 스트릭도 자동으로 따라 바뀐다.
    ⚠️ 예전엔 "전교생 중 아무도 기록이 없는 날 = 휴업일"이라는 휴리스틱을 썼다.
       그래서 출결 데이터가 밀리면 수업일이 통째로 휴업일로 보였다.
       지금은 나이스 학사일정(isSchoolDay)으로 판단한다. */
function dayVerdict(ds, ctx, freezeSet){
  var st = attStatusOf(ds, ctx);
  if (st === '출석')                  return 'up';
  if (st === '지각' || st === '공결') return 'keep';
  if (st === '결석')                  return freezeSet.has(ds) ? 'keep' : 'break';
  // null = 판정 보류: 휴업일 · 오늘(아직 인증 전) · 담당 소스가 없는 구간
  return 'skip';
}

/** 날짜 문자열을 하루씩 옮긴다 — UTC 정오 기준이라 기기 시간대에 안 흔들린다 */
function shiftDay(ds, n){
  return new Date(new Date(ds+'T12:00:00Z').getTime() + n*86400000)
           .toISOString().slice(0,10);
}

/** 오늘부터 거꾸로 세어 현재 연속일 + 끊긴 날짜를 찾는다 */
function calcStreak(ctx, freezeSet, todayStr){
  var streak = 0, brokenAt = null, ds = todayStr;
  for (var i = 0; i < 400; i++){
    if (!isWeekend(ds)){
      var v = dayVerdict(ds, ctx, freezeSet);
      if (v === 'up') streak++;
      else if (v === 'break'){ brokenAt = ds; break; }
    }
    ds = shiftDay(ds, -1);
  }
  return { streak: streak, brokenAt: brokenAt };
}

/** 역대 최장 기록 — 가장 오래된 기록부터 오늘까지 훑으며 최대 연속 구간을 찾는다 */
function calcLongest(ctx, freezeSet, todayStr){
  var all = Object.keys(ctx.days || {})
              .concat(Object.keys(ctx.am || {}))
              .concat(Object.keys(ctx.ov || {})).sort();
  if (!all.length) return 0;
  var best = 0, run = 0, ds = all[0];
  for (var i = 0; i < 800 && ds <= todayStr; i++){
    if (!isWeekend(ds)){
      var v = dayVerdict(ds, ctx, freezeSet);
      if (v === 'up'){ run++; if (run > best) best = run; }
      else if (v === 'break') run = 0;
    }
    ds = shiftDay(ds, 1);
  }
  return best;
}

/** 오늘 아직 출결 기록이 없어 "오늘 결석하면 끊기는" 상태인지 */
function calcAtRisk(ctx, todayStr, streak){
  if (streak <= 0) return false;
  if (!isSchoolDay(todayStr)) return false;      // 휴업일엔 위험하지 않다
  return attStatusOf(todayStr, ctx) === null;    // 아직 판정할 기록이 없다
}

async function loadStreak(force){
  if (streakCache && !force) return streakCache;
  await loadCalendar();

  var m = await FS.memberById(ME.id || '');
  // ⚠️ 전교생 출결을 훑지 않는다 — 보안규칙상 학생은 자기 것만 읽을 수 있고,
  //    Firestore 쿼리는 문서 하나라도 권한이 없으면 통째로 실패한다.
  //    "그날이 수업일이었나"는 나이스 학사일정(isSchoolDay)이 판단하므로
  //    전교생 기록을 볼 이유도 없어졌다.
  var myDays = await FS.attendanceOf(ME.name);
  var mk = Object.keys(myDays).sort();
  var legacyLast = mk.length ? mk[mk.length-1] : '';

  var am = {}, ov = {};
  try { am = await FS.amCheckInsOf(ME.name); } catch(e){}
  try { ov = await FS.amOverridesOf(ME.name); } catch(e){}

  var fz = await FS.freezeOf(ME.name);
  var freezeSet = new Set(fz.dates);
  var today = kstToday();
  var ctx = { days: myDays, legacyLast: legacyLast, today: today,
              dorm: m ? m.dorm : ME.dorm, am: am, ov: ov };

  var r = calcStreak(ctx, freezeSet, today);
  streakCache = {
    streak:   r.streak,
    brokenAt: r.brokenAt,
    longest:  Math.max(r.streak, calcLongest(ctx, freezeSet, today)),
    atRisk:   calcAtRisk(ctx, today, r.streak),
    freezes:  fz.count,
    freezeBought: fz.bought,
    freezeDates: fz.dates,
    coins:    ME.coins
  };
  return streakCache;
}

/* ═══ 방과후 출석체크 ═══════════════════════════════════
   수업 시작 18:30 · 마감 당일 24:00 (전부 한국시간)
   결석은 저장하지 않는다 — 체크인 기록이 없으면 결석으로 계산한다.
   자정이 지나면 자동으로 결석이 확정되므로 마감 트리거가 필요 없다. */
var AS_START_MIN = 18*60 + 30;   // 18:30
var asDate = null;               // 교사가 보고 있는 날짜

function pad2(n){return String(n).padStart(2,'0');}
/** 브라우저 시계와 무관하게 한국시간으로 환산 */
function kstNow(){
  var d=new Date();
  return new Date(d.getTime() + d.getTimezoneOffset()*60000 + 9*3600000);
}
function kstToday(){var k=kstNow();return k.getFullYear()+'-'+pad2(k.getMonth()+1)+'-'+pad2(k.getDate());}
function kstMinutes(){var k=kstNow();return k.getHours()*60+k.getMinutes();}

/** 수업의 대상 반 — GAS _classTrack과 동일 규칙 */
function classTrack(c){
  var t=String(c.track||'').trim();
  if(t==='공무원'||t==='공기업') return t;
  var s=String(c.subject||'');
  if(s.indexOf('공무원')>=0) return '공무원';
  if(s.indexOf('공기업')>=0) return '공기업';
  return '공통';
}

/** 그 날짜에 실제로 열리는 수업 목록 (반복수업 + 특강 − 휴강) */
function classesOn(sched, dateStr){
  var WD=['일','월','화','수','목','금','토'];
  var wd=WD[dowOf(dateStr)];        // 기기 시간대와 무관하게(§16.5)
  var ex=sched.exceptions||[];
  var cancels=ex.filter(function(e){return e.date===dateStr&&e.type==='휴강';});
  var items=(sched.weekly||[])
    .filter(function(c){return c.day===wd;})
    .filter(function(c){return (!c.startDate||dateStr>=c.startDate)&&(!c.endDate||dateStr<=c.endDate);})
    .filter(function(c){return !cancels.some(function(x){return x.subject===c.subject;});});
  ex.filter(function(e){return e.date===dateStr&&e.type==='특강';}).forEach(function(e){items.push(e);});
  return items;
}

    '<label style="display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px">날짜</label>'+

          '<div class="row-v" style="color:'+(absent?'var(--rose)':'var(--green)')+'">'+

        '</div></div>'+
        roster.map(function(m){

            '<span class="chip" style="background:'+bg+';color:'+color+'">'+label+'</span></div>';
        }).join('')+

  });

  if(!past) html+='<div class="notice" style="color:var(--ink-mute);cursor:default">'+ic('clock',15)+
    '<span>오늘 24시가 지나면 미체크는 결석으로 확정됩니다</span></div>';
  v.innerHTML=html;
}

async function fillTeacherHome(){
  if (!document.getElementById('thRoster')) return;
  await loadCalendar();
  var today = kstToday();
  var set = function(id, v){ var e=document.getElementById(id); if(e) e.textContent=v; };

  set('thDate', isSchoolDay(today) ? '' : '· '+(offReason(today)||'휴업일'));

  // 명부·출결·등교·정정을 한꺼번에 받는다
  var got = await Promise.all([ soft(FS.members(), []), soft(FS.attendanceAll(), { byName:{} }),
                                soft(FS.amCheckIns(today), {}), soft(FS.amOverrides(today), {}) ]);
  var mem = got[0];
  if (!mem.length){
    var r0=document.getElementById('thRoster');
    if(r0) r0.innerHTML='<div class="blk"><div class="row-s">명부를 불러오지 못했습니다</div></div>';
    return;
  }

  // 오늘 출결
  var att = got[1], am = got[2], ov = got[3];
  var legacyLast = '';
  for (var nm in att.byName){
    var ks = Object.keys(att.byName[nm]).sort();
    if (ks.length && ks[ks.length-1] > legacyLast) legacyLast = ks[ks.length-1];
  }

  var cnt = { 출석:0, 지각:0, 결석:0, 공결:0, 미체크:0 };
  var rows = mem.map(function(m){
    var ctx = { days: att.byName[m.name]||{}, legacyLast: legacyLast, today: today, dorm: m.dorm,
                am: am[m.name] ? _one(today, am[m.name]) : {},
                ov: ov[m.name] ? _one(today, ov[m.name]) : {} };
    var st = attStatusOf(today, ctx);
    var label = st || (isSchoolDay(today) ? '미체크' : '—');
    if (cnt[label] !== undefined) cnt[label]++;
    var c = amColor(st);
    return '<div class="row" onclick="amDate=\''+today+'\';go(\'att\')" style="cursor:pointer">'+
      '<div class="avatar">'+m.name.charAt(0)+'</div>'+
      '<div class="row-main"><div class="row-t">'+escapeHtml(m.name)+'</div>'+
      '<div class="row-s">'+m.track+'반'+(m.dorm?' · 기숙사':'')+'</div></div>'+
      '<span class="chip" style="background:'+c[0]+';color:'+c[1]+';margin-right:8px">'+label+'</span>'+
      '<span class="row-v" style="color:'+(m.coins<0?'var(--rose)':'var(--ink-soft)')+'">'+m.coins+'냥</span></div>';
  });

  set('thPresent', cnt.출석 + ' / ' + mem.length + '명');
  set('thLate',   cnt.지각 + '명');
  set('thAbsent', cnt.결석 + '명');
  document.getElementById('thRoster').innerHTML = rows.join('');

  // 이번 주 상담 — 교사만 읽힌다. 실패하면 '–'로 둔다.
  try {
    var recs = await FS.counselAll();
    var k = kstNow();
    var mon = new Date(k.getFullYear(), k.getMonth(), k.getDate() - ((k.getDay()+6)%7));
    var monDs = mon.getFullYear()+'-'+pad2(mon.getMonth()+1)+'-'+pad2(mon.getDate());
    set('thCounsel', recs.filter(function(r){ return r.date >= monDs; }).length + '건');
  } catch(e){ set('thCounsel', '–'); }
}

async function studentLogin(){
  var btn=document.getElementById('sGo');
  var id=(document.getElementById('sNo').value||'').trim();
  var nm=(document.getElementById('sName').value||'').trim();
  var pin=(document.getElementById('sPin').value||'').trim();
  if(!id||!nm){ sShowErr('학번과 이름을 입력해주세요'); return; }
  if(!/^\d{4}$/.test(pin)){ sShowErr('PIN 4자리를 입력해주세요'); return; }
  if(!window.FS){ sShowErr('연결 준비 중입니다. 잠시 후 다시 해주세요'); return; }
  sShowErr(''); btn.disabled=true; btn.textContent='확인 중...';
  if (FS.__clear) FS.__clear();
  try{
    var m = await FS.memberById(id);
    if(!m)            { sShowErr('학번을 찾을 수 없습니다'); return; }
    if(m.name !== nm) { sShowErr('학번과 이름이 맞지 않습니다'); return; }

    // 이 기기를 이 학생으로 연결한다. PIN이 틀리면 보안규칙이 막는다
    // (해시 대조를 규칙 안에서 하므로 앱이 정답을 알 필요가 없다).
    var bound = await tryBind(m, pin);
    if (!bound){
      // 이 기기가 이미 다른 학생으로 연결돼 있으면(로그아웃 없이 바꾼 경우)
      // 익명 계정을 새로 받아 다시 시도한다. 연결 문서는 수정이 안 되기 때문.
      var mine = null;
      try { mine = await FS.myBinding(); } catch(e){}
      if (mine && mine.name !== m.name){
        await AUTH.leave();                 // signOut → 새 익명 UID
        bound = await tryBind(m, pin);
      } else if (mine && mine.name === m.name){
        // 이 기기는 이미 이 학생으로 연결돼 있다(예전에 PIN을 맞게 넣어 만들어진 연결).
        // 연결 문서는 고칠 수 없어서 다시 만들려다 막힌 것이지 PIN이 틀린 게 아니다.
        // 자동 입실이 네트워크 문제로 실패해 로그인 화면이 뜬 경우가 이렇다.
        bound = true;
      }
    }
    if (!bound){ sShowErr('PIN이 맞지 않습니다'); return; }

    await applyStudent(m);
    try{ localStorage.setItem(SKEY, JSON.stringify({id:m.id,name:m.name})); }catch(e){}
    enterApp('student');
  }catch(e){
    sShowErr('불러오지 못했습니다. 인터넷 연결을 확인해주세요');
  }finally{
    btn.disabled=false; btn.textContent='입실하기';
  }
}

/** 기기 연결을 시도한다. PIN이 틀리면 보안규칙이 막아 false가 된다.
    아직 PIN을 안 정한 학생이면 이번 입력값을 그 학생의 PIN으로 등록한다.
    studentPin 생성은 "없을 때만" 되므로 남의 PIN을 덮어쓸 수 없다. */
async function tryBind(m, pin){
  try { await FS.bindStudent(m.id, m.name, pin); return true; }
  catch(e){
    if (!e || e.code !== 'permission-denied') throw e;
  }
  try {
    await FS.setPin(m.id, pin);              // 이미 있으면 규칙이 막는다
    await FS.bindStudent(m.id, m.name, pin);
    return true;
  } catch(e){ return false; }
}

/* 기기에 기억된 학생으로 자동 입실 — 매번 학번을 다시 치지 않게 */
async function autoLogin(){
  var saved; try{ saved=JSON.parse(localStorage.getItem(SKEY)||'null'); }catch(e){ return; }
  if(!saved || !saved.id) return;
  try{
    var m = await FS.memberById(saved.id);
    if(!m || m.name !== saved.name) return;   // 명단에서 빠졌거나 이름이 바뀐 경우
    await applyStudent(m);
    enterApp('student');
  }catch(e){ /* 오프라인이면 그냥 로그인 화면에 머문다 */ }
}

/* 이번 주(월~금) 출결 점 — 기록이 없는 지난 수업일은 결석으로 본다.
   '기록이 없으면 결석'은 방과후·스트릭과 같은 규칙이다(§10.5). */
async function buildWeek(name){
  // 학사일정·구앱 출결·등교·정정을 한꺼번에 받는다
  var got = await Promise.all([ loadCalendar(), FS.attendanceOf(name),
                                soft(FS.amCheckInsOf(name), {}), soft(FS.amOverridesOf(name), {}) ]);
  var days = got[1];
  var today = kstToday();
  // 이번 주 v2 기록·교사 정정도 함께 본다 (구앱 이력만 보면 전환 후 빈칸이 된다)
  var am = got[2], ov = got[3];
  var legacyLast = Object.keys(days).sort().pop() || '';
  var k = kstNow();
  var dow = k.getDay();                       // 0=일
  var mon = new Date(k.getFullYear(), k.getMonth(), k.getDate() - ((dow+6)%7));
  var LBL=['월','화','수','목','금'], out=[], week=[];
  for(var i=0;i<5;i++){
    var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i);
    var ds = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    week.push(ds);
    out.push({d:LBL[i], s:''});
  }
  // (본인 기록만 이름으로 가져온다 — 날짜별 전체 조회는 규칙상 막힌다)

  var ctx = { days:days, legacyLast:legacyLast, today:today, dorm:ME.dorm,
              am:{}, ov:{} };
  for (var key in am) ctx.am[key] = am[key];
  for (var key2 in ov) ctx.ov[key2] = ov[key2];

  for (var n=0;n<out.length;n++){
    var ds2 = week[n];
    var st = attStatusOf(ds2, ctx);
    out[n].s = st==='출석' ? 'ok' : st==='지각' ? 'late' : st==='결석' ? 'no'
             : st==='공결' ? 'late' : (ds2===today ? 'today' : '');
  }
  return out;
}

/* ═══ 교사 로그인 ═══════════════════════════════════════
   익명 인증만으로는 규칙에서 교사를 구분할 수 없어서,
   교사만 이메일·비밀번호로 들어온다. 한 번 로그인하면
   그 기기에서는 계속 유지된다(browserLocalPersistence). */
function showTeacherLogin(){
  document.getElementById('tOpen').classList.add('hidden');
  document.getElementById('tLogin').classList.remove('hidden');
  document.getElementById('tEmail').focus();
}
function hideTeacherLogin(){
  var box=document.getElementById('tLogin'); if(!box) return;
  box.classList.add('hidden');
  document.getElementById('tOpen').classList.remove('hidden');
  document.getElementById('tPw').value='';
  tShowErr('');
}
function tShowErr(msg){
  var e=document.getElementById('tErr'); if(!e) return;
  e.textContent=msg;
  e.classList.toggle('hidden',!msg);
}
/* 파이어베이스 오류코드를 학교에서 알아볼 수 있는 말로 */
function tAuthMsg(err){
  var c=(err&&err.code)||'';
  if(c==='app/not-teacher')                 return '교사 계정이 아닙니다';
  // Firebase는 "계정 없음"과 "비밀번호 틀림"을 구분해 알려주지 않는다
  // (이메일 존재 여부 노출 방지). 그래서 두 경우를 한 문구로 안내한다.
  if(c.indexOf('invalid-credential')>=0 ||
     c.indexOf('wrong-password')>=0 ||
     c.indexOf('user-not-found')>=0)
    return '이메일 또는 비밀번호가 맞지 않습니다. 앞뒤 공백을 확인하고, '+
           '계속 안 되면 Firebase 콘솔에서 비밀번호를 재설정해주세요';
  if(c.indexOf('invalid-email')>=0)         return '이메일 형식이 아닙니다';
  if(c.indexOf('too-many-requests')>=0)     return '시도가 너무 잦습니다. 잠시 후 다시 해주세요';
  if(c.indexOf('network')>=0)               return '인터넷 연결을 확인해주세요';
  return '로그인에 실패했습니다';
}
async function teacherLogin(){
  var btn=document.getElementById('tGo');
  var email=(document.getElementById('tEmail').value||'').trim();
  var pw=document.getElementById('tPw').value||'';
  if(!email||!pw){ tShowErr('이메일과 비밀번호를 입력해주세요'); return; }
  if(!window.AUTH){ tShowErr('연결 준비 중입니다. 잠시 후 다시 해주세요'); return; }
  tShowErr('');
  btn.disabled=true; btn.textContent='확인 중...';
  try{
    await AUTH.signInTeacher(email,pw);
    if (window.FS && FS.__clear) FS.__clear();   // 교사로 바뀌면 볼 수 있는 자료가 늘어난다
    document.getElementById('tPw').value='';
    enterApp('teacher');
  }catch(e){
    tShowErr(tAuthMsg(e));
  }finally{
    btn.disabled=false; btn.textContent='로그인';
  }
}
function protoSync(){
  var on=document.getElementById('login').classList.contains('hidden')?(ROLE==='student'?0:1):2;
  var b=document.querySelectorAll('#proto button');
  for(var i=0;i<b.length;i++)b[i].className=(i===on?'on':'');
}
/* 푸시 알림 딥링크: ?goto=after&date=YYYY-MM-DD */
function applyDeepLink(){
  var q=new URLSearchParams(location.search);
  var goto=q.get('goto'); if(!goto) return;
  var d=q.get('date'); if(d) asDate=d;
  TAB=goto;
}
applyDeepLink();
fillIcoSlots();
/* 모듈(FS/AUTH)은 defer라 이 스크립트보다 늦게 뜬다 — 준비되면 자동 입실 */
if(window.FS) autoLogin();
else window.addEventListener('fs-ready', function(){ autoLogin(); });

/* 앱이 다시 앞으로 나올 때 알림을 새로 깐다 —
   예약분이 3주치뿐이라 오래 안 열면 바닥난다. 열 때마다 채워준다. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && ME.name) scheduleLocalNotis();
  // 다시 앞으로 나오면: 받아 둔 화면을 그대로 보여주고, 뒤에서 새로 받아 바뀐 게 있으면 다시 그린다
  if (!document.hidden && window.FS && FS.__stale){ FS.__stale(); softRefresh(); }
});

/** 뒤에서 받은 새 자료로 지금 화면을 다시 그린다.
    입력 중이거나 창(모달)이 떠 있으면 건드리지 않는다 — 쓰던 내용이 날아가면 안 된다. */
function softRefresh(){
  var app = document.getElementById('app');
  if (!app || app.classList.contains('hidden')) return;
  if (document.getElementById('modal')) return;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  var y = window.scrollY;
  renderView();
  window.scrollTo(0, y);
}
</script>
